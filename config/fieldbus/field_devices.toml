# Railway / low-RAM stress catalog — hosted AV 9101 loopback only (no Pi / OT LAN).
# OT bench overlay (do not commit campus IPs):
#   cp scripts/nightly-ot-bench/field_devices.bench.example.toml config/fieldbus/field_devices.toml
#
# Device name must NOT contain "weather" — id heuristics map *WEATHER* → weather and
# Zone Other / Overview charts skip it. Stamp OPENFDD_EQUIPMENT_TYPE=zone_other on compose.
# AV 9101 is Open-Meteo OAT; point_name maps to cookbook zone_t (#851 / STRESS 0b).

[[devices]]
name = "bldg2-zone-loopback"
enabled = true
device_instance = 599999
host = "127.0.0.1"
port = 47808
points = [
  { object_type = "analog-value", object_instance = 9101, point_name = "zone-air-temp", units = "°F" },
]
