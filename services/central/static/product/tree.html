<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open-FDD · Model tree</title>
<link rel="stylesheet" href="/app/assets/css/bench.css">
</head>
<body class="tree-page">
<header>
  <div>
    <h1>🌳 Model tree</h1>
    <div class="sub" id="sub">read-only · Open-FDD Haystack snapshot</div>
  </div>
  <div class="spacer"></div>
  <label class="scope">site <select id="sitePick"></select></label>
  <span class="pill">read-only</span>
  <a class="pill" href="/app/">← dashboard</a>
</header>
<main class="tree-main">
  <div id="err"></div>
  <section class="panel">
    <h2>Haystack tree <span class="hint">agent-context + package mapping</span></h2>
    <div id="tree" class="tree-host tree-host-tall"></div>
    <div class="detail" id="detail"><span class="hint">Select a node.</span></div>
  </section>
</main>
<script type="module" src="/app/assets/js/tree-page.js"></script>
</body>
</html>
