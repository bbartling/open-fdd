[package]
name = "openfdd-central"
version = "3.3.24"
edition = "2021"
license = "MIT"
description = "Open-FDD Central — MQTTS ingest, canonical Parquet historian, FDD, JWT REST + OpenAPI"

[[bin]]
name = "openfdd-central"
path = "src/main.rs"

[dependencies]
openfdd_contracts = { path = "../../crates/openfdd_contracts", features = ["openapi"] }
openfdd_mqtt = { path = "../../crates/openfdd_mqtt" }
open_fdd_edge_prototype = { path = "../../edge" }
fdd_core = { path = "../../crates/fdd_core" }
fdd_rules = { path = "../../crates/fdd_rules" }
fdd_sql = { path = "../../crates/fdd_sql" }
fdd_store = { path = "../../crates/fdd_store" }
datafusion.workspace = true
object_store.workspace = true
url.workspace = true

axum = { version = "0.8", features = ["macros"] }
bytes = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
anyhow = "1"
csv = { workspace = true }
dashmap = "6"
tempfile = "3"
# aws_lc_rs avoids transitive `rsa` (RUSTSEC-2023-0071); we only mint/verify HS256.
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
rumqttc = { version = "0.24", default-features = false, features = ["use-native-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
base64 = "0.22"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
