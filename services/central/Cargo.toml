[package]
name = "openfdd-central"
version = "3.6.5"
edition = "2021"
license = "MIT"
description = "Open-FDD Central — MQTTS ingest, Timescale historian, SQL FDD, JWT REST + OpenAPI"

[[bin]]
name = "openfdd-central"
path = "src/main.rs"

# Wave-X: Timescale-only. DataFusion / legacy-* features deleted (C2).
[features]
default = []

[lints.rust]
# Tombstone cfgs remain on retired branches until those call sites are deleted.
unexpected_cfgs = { level = "allow", check-cfg = [
  'cfg(feature, values("legacy-datafusion", "legacy-parquet"))',
] }

[dependencies]
openfdd_contracts = { path = "../../crates/openfdd_contracts", features = ["openapi"] }
openfdd_mqtt = { path = "../../crates/openfdd_mqtt" }
open_fdd_edge_prototype = { path = "../../edge", default-features = false }
fdd_core = { path = "../../crates/fdd_core" }
fdd_rules = { path = "../../crates/fdd_rules" }
fdd_resources = { path = "../../crates/fdd_resources" }
fdd_store = { path = "../../crates/fdd_store" }
fdd_tsdb = { path = "../../crates/fdd_tsdb" }
object_store.workspace = true
url.workspace = true
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "chrono",
  "json",
] }

axum = { version = "0.8", features = ["macros"] }
bytes = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
anyhow = "1"
futures-util = "0.3"
csv = { workspace = true }
dashmap = "6"
tempfile = "3"
# aws_lc_rs avoids transitive `rsa` (RUSTSEC-2023-0071); we only mint/verify HS256.
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
rumqttc = { version = "0.24", default-features = false, features = ["use-native-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls"] }

[dev-dependencies]
base64 = "0.22"
openfdd-fieldbus = { path = "../fieldbus" }
openfdd_connector_runtime = { path = "../../crates/openfdd_connector_runtime" }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
