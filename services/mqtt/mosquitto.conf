# Mosquitto MQTTS (listener 8883, cert auth, no anonymous)

persistence true
persistence_location /mosquitto/data/

# Allow full-site HVAC telemetry envelopes (rumqttc client also raised to 1 MiB).
# Default broker behavior is unlimited for MQTT 3.1.1; set explicitly for ops clarity.
max_packet_size 1048576

listener 8883
protocol mqtt
allow_anonymous false
require_certificate true
use_identity_as_username true
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.cert.pem
keyfile /mosquitto/certs/server.key.pem
acl_file /mosquitto/certs/acl

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
