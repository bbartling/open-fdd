[package]
name = "openfdd-fieldbus"
version = "3.5.60"
edition = "2021"
rust-version = "1.93"
description = "Open-FDD fieldbus edge — BACnet/Modbus/Haystack poll + local Swagger + MQTTS publish"
license = "MIT"

[[bin]]
name = "openfdd-fieldbus"
path = "src/main.rs"

[[bin]]
name = "openfdd-bacnet-modbus"
path = "src/bin/openfdd-bacnet-modbus.rs"

[[bin]]
name = "openfdd-haystack"
path = "src/bin/openfdd-haystack.rs"

[dependencies]
openfdd_contracts = { path = "../../crates/openfdd_contracts", features = ["openapi"] }
openfdd_connector_runtime = { path = "../../crates/openfdd_connector_runtime" }
openfdd_mqtt = { path = "../../crates/openfdd_mqtt" }
fdd_core = { path = "../../crates/fdd_core" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
thiserror = "2"
subtle = "2"

dotenvy = "0.15"
toml = "0.8"
csv = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
base64 = "0.22"
url = "2"

bacnet-types = "0.11"
bacnet-encoding = "0.11"
bacnet-services = "0.11"
bacnet-transport = "0.11"
bacnet-client = "0.11"
bacnet-objects = "0.11"
bacnet-server = "0.11"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }

# rusty-haystack v0.8.1 — latest tagged release. Niagara Basic uses fieldbus reqwest+zinc
# (haystack.rs); tip 0.9.0 needs rustc 1.97 + rand 0.10 conflict — revisit when tagged.
haystack_client = { package = "rusty-haystack-client", git = "https://github.com/jscott3201/rusty-haystack", rev = "d85e72271e789d3dcf4a90f79adb7d1556faae80", version = "0.8.1" }
haystack_core = { package = "rusty-haystack-core", git = "https://github.com/jscott3201/rusty-haystack", rev = "d85e72271e789d3dcf4a90f79adb7d1556faae80", version = "0.8.1" }

# rusty-modbus v0.1.1 (tag); bacnet stays on patched 0.9 — crates.io 0.10 lacks add_routed_device (MS/TP).
rusty-modbus-client = { git = "https://github.com/jscott3201/rusty-modbus", rev = "57135620af03f291f85d71eca76f4c8fbe83b2c1", version = "0.1.1" }
rusty-modbus-types = { git = "https://github.com/jscott3201/rusty-modbus", rev = "57135620af03f291f85d71eca76f4c8fbe83b2c1", version = "0.1.1" }

uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"
# Keep chrono 0.4.39 for arrow-arith/datafusion compatibility (do not pull axum-test 18).
tower = "0.5"
