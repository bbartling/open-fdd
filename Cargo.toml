[workspace]
resolver = "2"
members = [
    "edge",
    "mcp",
    "crates/fdd_core",
    "crates/fdd_csv",
    "crates/fdd_store",
    "crates/fdd_resources",
    "crates/fdd_tsdb",
    "crates/fdd_rules",
    "crates/openfdd_contracts",
    "services/central",
]
# OT field containers, the MQTT broker, the MQTT client, and the edge process
# are archived under archive/ot-edge/. Product ingest is the Normal Framework
# portal and CSV only.
exclude = [
    "archive",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/bbartling/open-fdd"
version = "4.0.4"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
object_store = { version = "0.13", features = ["aws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
url = "2"
walkdir = "2"

# Product crates, including the edge package/semantic helper, opt in with
# `lints.workspace = true`. Archived OT trees under archive/ are not workspace
# members and do not inherit these lints.
# Standard: openfdd_agent_spec/docs/RUST_BEST_PRACTICES.md
[workspace.lints.rust]
# Tombstone cfg for archived OT transport branches until those call sites are deleted.
unexpected_cfgs = { level = "allow", check-cfg = [
  'cfg(feature, values("ot-transport"))',
] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
await_holding_lock = "deny"
ptr_arg = "deny"
redundant_clone = "deny"
rc_buffer = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
