[workspace]
resolver = "2"
members = [
    "edge",
    "mcp",
    "crates/fdd_core",
    "crates/fdd_csv",
    "crates/fdd_store",
    "crates/fdd_sql",
    "crates/fdd_rules",
    "crates/fdd_bench",
    "crates/fdd_cli",
    "crates/openfdd_contracts",
    "crates/openfdd_mqtt",
    "services/fieldbus",
    "services/central",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/bbartling/open-fdd"
version = "3.3.10"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
arrow = "53"
arrow-schema = "53"
chrono = { version = "=0.4.39", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
datafusion = "43"
object_store = { version = "0.11.2", features = ["aws"] }
parquet = "53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
url = "2"
walkdir = "2"

# Patch crates.io bacnet-client 0.9 with add_routed_device (MS/TP seed). Keep on 0.9:
# crates.io bacnet-client 0.10.1 still lacks add_routed_device. Drop the path patch when
# upstream ships that helper on a publishable release.
[patch.crates-io]
bacnet-client = { path = "vendor/bacnet-client" }
