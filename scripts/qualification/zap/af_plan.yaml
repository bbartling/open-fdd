# Authenticated ZAP Automation Framework plan (Wave U U5)
# Disposable web+central only — OT drivers disabled/unreachable.
# Do NOT upload JWT files; inject via env at runtime and delete after.
#
# Coverage gates (must be asserted by runner):
# - at least one authenticated request to /api/auth/me
# - site[] nonempty
# - jobs complete without failOnError=false swallowing errors
#
# Active scan stays Soft-OPEN until runner proves auth coverage on a disposable candidate.

env:
  contexts:
    - name: openfdd-disposable
      urls:
        - "${ZAP_TARGET_ORIGIN}"
      includePaths:
        - "${ZAP_TARGET_ORIGIN}.*"
      authentication:
        method: "manual"
        # Prefer header injection from env — never commit tokens:
        # ZAP_AUTH_HEADER_VALUE="Bearer <ephemeral>"
      sessionManagement:
        method: "headers"
        parameters:
          Authorization: "${ZAP_AUTH_HEADER_VALUE}"
      users: []

jobs:
  - type: openapi
    parameters:
      apiUrl: "${ZAP_TARGET_ORIGIN}/openapi.json"
      context: openfdd-disposable

  - type: spider
    parameters:
      context: openfdd-disposable
      url: "${ZAP_TARGET_ORIGIN}/"
      maxDuration: 5

  # Authenticated /api/auth/me coverage is asserted by run_af_disposable.py
  # preflight (UA-04). Do not use ZAP job type "request" — older zaproxydocker
  # digests reject it ("Unrecognised job type: request").

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  # Active scan: enable only when OPENFDD_ZAP_AF_ACTIVE=1 on disposable candidate.
  # - type: activeScan
  #   parameters:
  #     context: openfdd-disposable
  #     policy: "Default Policy"
  #     maxRuleDurationInMins: 5
  #     maxScanDurationInMins: 30

  - type: report
    parameters:
      template: traditional-json
      reportDir: "${ZAP_REPORT_DIR}"
      reportFile: zap-af-report
      reportTitle: "Open-FDD ZAP AF (disposable)"
