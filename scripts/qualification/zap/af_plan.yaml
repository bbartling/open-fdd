# Authenticated ZAP Automation Framework plan (Wave U U5 / Astra C-ZAP)
# Disposable web+central only — OT drivers disabled/unreachable.
# Do NOT upload JWT files; inject via env at runtime and delete after.
#
# Coverage gates (must be asserted by run_af_disposable.py):
# - verified authenticated /api/auth/me (HTTP 200 + JSON role/subject)
# - site[] nonempty matching ZAP_TARGET_ORIGIN
# - jobs complete without failOnError=false swallowing errors
# - High=0 and undispositioned Medium=0
#
# Active scan: enable only when OPENFDD_ZAP_AF_ACTIVE=1 on disposable candidate.

env:
  contexts:
    - name: openfdd-disposable
      urls:
        # Prefer SPA root on web+central disposable; health remains a 200 seed.
        - "${ZAP_TARGET_ORIGIN}/"
        - "${ZAP_TARGET_ORIGIN}/api/health"
      includePaths:
        - "${ZAP_TARGET_ORIGIN}.*"
      authentication:
        method: "manual"
        # Prefer header injection from env — never commit tokens:
        # ZAP_AUTH_HEADER_VALUE="Bearer <ephemeral>"
      sessionManagement:
        method: "headers"
        parameters:
          Authorization: "${ZAP_AUTH_HEADER_VALUE}"
      users: []

jobs:
  # Prefer a staged OpenAPI file. nginx SPA may serve HTML for /openapi.json;
  # run_af_disposable.py fetches the central spec into /zap/wrk before AF runs.
  - type: openapi
    parameters:
      apiFile: "/zap/wrk/openapi.json"
      # targetUrl supplements specs that omit servers[] (also injected at stage).
      targetUrl: "${ZAP_TARGET_ORIGIN}"
      context: openfdd-disposable

  - type: spider
    parameters:
      context: openfdd-disposable
      url: "${ZAP_TARGET_ORIGIN}/"
      maxDuration: 5

  # Authenticated /api/auth/me coverage is asserted by run_af_disposable.py
  # preflight (status + identity schema). Do not use ZAP job type "request" —
  # older zaproxydocker digests reject it ("Unrecognised job type: request").
  # Do not treat report URL text containing /api/auth/me as authenticated proof.

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  # Active scan: inserted by run_af_disposable.py when OPENFDD_ZAP_AF_ACTIVE=1.
  # - type: activeScan
  #   parameters:
  #     context: openfdd-disposable
  #     policy: "Default Policy"
  #     maxRuleDurationInMins: 5
  #     maxScanDurationInMins: 30

  - type: report
    parameters:
      template: traditional-json
      reportDir: "${ZAP_REPORT_DIR}"
      reportFile: zap-af-report
      reportTitle: "Open-FDD ZAP AF (disposable web+central)"
