# Railway / low-RAM stress catalog — hosted AV 9101 loopback only (no Pi / OT LAN).
# Used by scripts/nightly-ot-bench when RAILWAY_ONLY=1.
#
# Device name must NOT contain "weather" — id heuristics map *WEATHER* → weather.
# AV 9101 → point_name zone-air-temp → cookbook zone_t (#851 / STRESS 0b).

[[devices]]
name = "bldg2-zone-loopback"
enabled = true
device_instance = 599999
host = "127.0.0.1"
port = 47808
points = [
  { object_type = "analog-value", object_instance = 9101, point_name = "zone-air-temp", units = "°F" },
]
