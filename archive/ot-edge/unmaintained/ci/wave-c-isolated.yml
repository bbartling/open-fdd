name: Wave C isolated suites

# Disposable ZAP AF + MQTTS isolation + restore-to-empty. Pull GHCR only; no local stack builds.
# 4.0 master does not publish openfdd-mqtt. A pull request whose base sha has no
# mqtt manifest skips this job successfully. Do not fall back to a pre-4.0
# sha-* (those tags are outside the portal publish). workflow_dispatch still
# requires a sha-<7> that is actually published. This lane does not boot the
# OT archive OCI pin.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable Open-FDD GHCR tag (sha-xxxxxxx)
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/wave-c-isolated.yml
      - scripts/integration/mqtts_transport_isolation.sh
      - scripts/qualification/run_isolated_zap_af.sh
      - scripts/qualification/restore_to_empty.sh
      - scripts/qualification/run_wave_c_isolated.sh
      - scripts/qualification/zap/**
      - scripts/qualification/fixtures/bounded_perf_baseline.json

permissions:
  contents: read
  packages: read

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image tag
        id: image
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.image_tag }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tag_exists() {
            local t="$1" tok code
            tok="$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:bbartling/openfdd-mqtt:pull" | jq -r .token)"
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${tok}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/bbartling/openfdd-mqtt/manifests/${t}")"
            [[ "$code" == "200" ]]
          }
          skip=0
          tag=""
          reason=""
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
            if [[ ! "$tag" =~ ^sha-[0-9a-f]{7}$ ]] || ! tag_exists "$tag"; then
              echo "workflow_dispatch needs a published openfdd-mqtt tag sha-<7>; got: ${tag:-empty}" >&2
              echo "4.0 master does not publish openfdd-mqtt. This job does not use the OT archive OCI pin." >&2
              exit 1
            fi
          else
            [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            tag="sha-${PR_BASE_SHA:0:7}"
            if ! tag_exists "$tag"; then
              skip=1
              reason="openfdd-mqtt:${tag} is not published. 4.0 portal publishes central and web only, so Wave C isolated suites are skipped."
              echo "$reason" >&2
              tag=""
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<EOF"
            printf '%s\n' "$reason"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ "$skip" == "0" ]]; then
            echo "Resolved OPENFDD_IMAGE_TAG=$tag"
          fi

      - name: Record 4.0 skip
        if: steps.image.outputs.skip == '1'
        run: |
          {
            echo "## Wave C isolated suites"
            echo
            echo "${{ steps.image.outputs.reason }}"
            echo
            echo "Dispatch this workflow with a sha-<7> that still has \`openfdd-mqtt\` if the suite must run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Wave C isolated suites
        if: steps.image.outputs.skip != '1'
        env:
          OPENFDD_IMAGE_TAG: ${{ steps.image.outputs.tag }}
          ARTIFACT_DIR: ${{ github.workspace }}/reports/waveC_isolated_ci
        run: |
          chmod +x \
            scripts/integration/mqtts_transport_isolation.sh \
            scripts/qualification/restore_to_empty.sh \
            scripts/qualification/run_isolated_zap_af.sh \
            scripts/qualification/run_wave_c_isolated.sh
          ./scripts/qualification/run_wave_c_isolated.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-c-isolated-${{ steps.image.outputs.tag }}
          path: reports/waveC_isolated_ci
          if-no-files-found: ignore
