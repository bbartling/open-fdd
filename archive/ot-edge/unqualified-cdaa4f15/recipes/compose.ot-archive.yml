# Explicit OT archive lane. Not selected by scripts/openfdd_stack_up.sh.
# Refuses to embed a 4.0 central image. Fieldbus and mqtt build from this snapshot.
# Set OPENFDD_OT_ARCHIVE_TAG to an explicit tag or digest before render.
# Do not attach a 4.0 Timescale volume.

name: openfdd-ot-archive

services:
  mqtt:
    image: ghcr.io/bbartling/openfdd-mqtt:${OPENFDD_OT_ARCHIVE_TAG:?set OPENFDD_OT_ARCHIVE_TAG}
    build:
      context: ../source/services/mqtt
    ports:
      - "127.0.0.1:8883:8883"

  fieldbus:
    image: ghcr.io/bbartling/openfdd-fieldbus:${OPENFDD_OT_ARCHIVE_TAG:?set OPENFDD_OT_ARCHIVE_TAG}
    build:
      context: ../source
      dockerfile: services/fieldbus/Dockerfile.closure
      target: ${OPENFDD_OT_ARCHIVE_FIELDBUS_TARGET:-compatibility}
    environment:
      OPENFDD_MQTT_ENABLED: "0"
      OPENFDD_FIELDBUS_HTTP_HOST: 127.0.0.1
      OPENFDD_FIELDBUS_CONFIG_DIR: /app/config
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - mqtt
