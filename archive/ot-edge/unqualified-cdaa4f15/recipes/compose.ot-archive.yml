# Explicit OT archive lane. Not selected by scripts/openfdd_stack_up.sh.
# Images are digest-pinned. This file does not build and does not attach a database.
# restore-isolated.sh --replay exports the digests from evidence/oci-pin.json.

name: openfdd-ot-archive

services:
  mqtt:
    image: ghcr.io/bbartling/openfdd-mqtt@${OPENFDD_OT_MQTT_DIGEST:?set OPENFDD_OT_MQTT_DIGEST}
    ports:
      - "127.0.0.1:8883:8883"

  fieldbus:
    image: ghcr.io/bbartling/openfdd-fieldbus@${OPENFDD_OT_FIELDBUS_DIGEST:?set OPENFDD_OT_FIELDBUS_DIGEST}
    environment:
      OPENFDD_MQTT_ENABLED: "0"
      OPENFDD_FIELDBUS_HTTP_HOST: 127.0.0.1
      OPENFDD_FIELDBUS_CONFIG_DIR: /app/config
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - mqtt
