# Wave-X overlay — merge with compose.react.yml / compose.csv.yml.
# Standalone Timescale: docker/compose.timescale.core.yml

x-openfdd-logging: &openfdd-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  timescale:
    image: ${OPENFDD_TIMESCALE_IMAGE:-timescale/timescaledb:latest-pg16}
    environment:
      POSTGRES_USER: ${OPENFDD_TIMESCALE_USER:-openfdd}
      POSTGRES_PASSWORD: ${OPENFDD_TIMESCALE_PASSWORD:-openfdd_dev_only}
      POSTGRES_DB: ${OPENFDD_TIMESCALE_DB:-openfdd}
    ports:
      - "${OPENFDD_TIMESCALE_BIND:-127.0.0.1}:5432:5432"
    # Init scripts run only when this named volume is empty (official Postgres
    # entrypoint). An existing openfdd-timescale volume is not re-bootstrapped.
    volumes:
      - openfdd-timescale:/var/lib/postgresql/data
      - ../sql/schema/00_extensions.sql:/docker-entrypoint-initdb.d/00_extensions.sql:ro
      - ../sql/schema/01_bps_core.sql:/docker-entrypoint-initdb.d/01_bps_core.sql:ro
      - ../sql/schema/02_openfdd_dims.sql:/docker-entrypoint-initdb.d/02_openfdd_dims.sql:ro
      - ../sql/schema/03_wide_history_helper.sql:/docker-entrypoint-initdb.d/03_wide_history_helper.sql:ro
      - ../sql/schema/04_provider_hourly_jobs.sql:/docker-entrypoint-initdb.d/04_provider_hourly_jobs.sql:ro
      - ../sql/schema/04_ingest_queue.sql:/docker-entrypoint-initdb.d/05_ingest_queue.sql:ro
      - ../sql/schema/05_portal_inventory.sql:/docker-entrypoint-initdb.d/06_portal_inventory.sql:ro
      - ../sql/schema/11_point_map_binding_metadata.sql:/docker-entrypoint-initdb.d/07_point_map_binding_metadata.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${OPENFDD_TIMESCALE_USER:-openfdd} -d ${OPENFDD_TIMESCALE_DB:-openfdd}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s
    logging: *openfdd-logging
    restart: unless-stopped

  central:
    environment:
      OPENFDD_DATABASE_URL: ${OPENFDD_DATABASE_URL:-postgresql://openfdd:openfdd_dev_only@timescale:5432/openfdd}
      OPENFDD_FDD_ENGINE: ${OPENFDD_FDD_ENGINE:-postgres-sql}
      OPENFDD_HISTORIAN: ${OPENFDD_HISTORIAN:-timescale}
      OPENFDD_SQL_ROOT: ${OPENFDD_SQL_ROOT:-/sql/fdd}
      OPENFDD_STORAGE_URL: ${OPENFDD_STORAGE_URL:-file:///workspace/openfdd-compat-retired}
    volumes:
      - ../sql:/sql:ro
    depends_on:
      timescale:
        condition: service_healthy

volumes:
  openfdd-timescale:
