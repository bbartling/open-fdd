services:
  minio:
    image: ${OPENFDD_MINIO_IMAGE:-quay.io/minio/minio:latest}
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${OPENFDD_MINIO_ROOT_USER:-openfdd}
      MINIO_ROOT_PASSWORD: ${OPENFDD_MINIO_ROOT_PASSWORD:-openfdd-local-test-only}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - openfdd-minio-data:/data

  minio-init:
    image: ${OPENFDD_MINIO_MC_IMAGE:-quay.io/minio/mc:latest}
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${OPENFDD_MINIO_ROOT_USER:-openfdd}
      MINIO_ROOT_PASSWORD: ${OPENFDD_MINIO_ROOT_PASSWORD:-openfdd-local-test-only}
      OPENFDD_MINIO_BUCKET: ${OPENFDD_MINIO_BUCKET:-openfdd-history}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$${OPENFDD_MINIO_BUCKET}"

volumes:
  openfdd-minio-data:
