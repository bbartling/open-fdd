# Open-FDD Central API. Product UI is React (`compose.react.yml` / `openfdd-web`).
# Ingest is the Normal Framework portal and CSV. The MQTT broker is archived.

name: openfdd-central

services:
  central:
    image: ${OPENFDD_CENTRAL_IMAGE:-ghcr.io/bbartling/openfdd-central:nightly}
    build:
      context: ..
      dockerfile: services/central/Dockerfile
    environment:
      OPENFDD_SITE_ID: ${OPENFDD_SITE_ID:-local}
      OPENFDD_WORKSPACE: /workspace
      OPENFDD_STORAGE_URL: file:///workspace/openfdd
      OPENFDD_QUERY_MEMORY_MB: ${OPENFDD_QUERY_MEMORY_MB:-512}
      OPENFDD_JWT_SECRET: ${OPENFDD_JWT_SECRET:-}
      OPENFDD_ADMIN_PASSWORD: ${OPENFDD_ADMIN_PASSWORD:-}
      OPENFDD_REACT_UI: "1"
      # P2-M6: React is the product default even on this compose file.
      OPENFDD_UI_GENERATION_DEFAULT: ${OPENFDD_UI_GENERATION_DEFAULT:-react}
    ports:
      - "${OPENFDD_CENTRAL_BIND:-0.0.0.0}:8080:8080"
    volumes:
      - ../workspace:/workspace
    restart: unless-stopped

  mcp:
    profiles: ["mcp"]
    image: ${OPENFDD_MCP_IMAGE:-ghcr.io/bbartling/openfdd-mcp:nightly}
    build:
      context: ..
      dockerfile: Dockerfile.mcp
    environment:
      OPENFDD_API_BASE: http://central:8080
      OPENFDD_MCP_TOKEN: ${OPENFDD_MCP_TOKEN:-}
    depends_on:
      - central
    stdin_open: true
    tty: true
    restart: unless-stopped
