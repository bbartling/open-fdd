# Plain HTTP Caddy for portal / csv (OPENFDD_CADDY_TLS=0).

services:
  caddy:
    image: ${OPENFDD_CADDY_IMAGE:-caddy:2.8-alpine}
    restart: unless-stopped
    ports:
      - "${OPENFDD_CADDY_HTTP_BIND:-0.0.0.0}:80:80"
    volumes:
      - ${OPENFDD_CADDYFILE:-./caddy/Caddyfile.central.http}:/etc/caddy/Caddyfile:ro
    environment:
      OPENFDD_CADDY_UPSTREAM: ${OPENFDD_CADDY_UPSTREAM:-central:8080}
    depends_on:
      - central
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
