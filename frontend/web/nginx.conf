# P1-M1-A: SPA + same-origin /api proxy with security + cache headers.
# OPENFDD_CENTRAL_UPSTREAM / OPENFDD_NGINX_RESOLVER are rendered by the nginx
# container entrypoint (envsubst). Default Compose upstream is central:8080.
#
# Critical for Railway: do NOT bake a static upstream hostname into nginx's
# compile-time resolver. Use a variable + resolver so private DNS
# (*.railway.internal) is resolved at request time after peer services exist.
#
# Astra A04: trust boundary for forwarded proto, HSTS on edge HTTPS, and
# per-route body/time limits (CSV/package keep 128m/600s; default API tighter).
resolver ${OPENFDD_NGINX_RESOLVER} valid=10s ipv6=off;
resolver_timeout 5s;

# Trust X-Forwarded-Proto only from private/link-local hops (Caddy / Compose /
# Railway mesh). Public clients cannot forge https→HSTS or upstream scheme by
# sending X-Forwarded-Proto on a direct :8080 hit (Astra A04 / R09).
map $remote_addr $openfdd_xfp_trusted {
    default                          0;
    ~^127\.                          1;
    ~^10\.                           1;
    ~^172\.(1[6-9]|2[0-9]|3[0-1])\.  1;
    ~^192\.168\.                     1;
    ::1                              1;
    ~^fc                             1;
    ~^fd                             1;
}

# HSTS only when a trusted hop asserted HTTPS (or nginx itself is on https).
map $openfdd_xfp_trusted$http_x_forwarded_proto $openfdd_hsts {
    default     "";
    1https      "max-age=31536000; includeSubDomains";
}

# Upstream central must see https when TLS terminated on a trusted edge hop.
map $openfdd_xfp_trusted$http_x_forwarded_proto $openfdd_forwarded_proto {
    default     $scheme;
    1https      https;
    1http       http;
}


server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Host publishes web as :3000→8080; absolute redirects would send users to :8080.
    absolute_redirect off;

    # Default body limit (CSV/package overrides below).
    client_max_body_size 16m;

    # Security headers (Unity WebGL later needs frame-ancestors adjusted carefully).
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security $openfdd_hsts always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: allow same-origin API + Wasm/blob for future Unity; no remote script CDNs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Runtime upstream host:port (no scheme). Variable forces lazy DNS lookup.
    set $openfdd_central "${OPENFDD_CENTRAL_UPSTREAM}";

    # Health must fail fast while central is restarting or wedged. A 600s
    # proxy read leaves the demo shell up and /api/health at 0 bytes until the
    # client gives up. Analytics keeps the long read timeout below.
    location = /api/health {
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_pass http://$openfdd_central;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $openfdd_forwarded_proto;
        proxy_intercept_errors on;
        error_page 502 503 504 = @central_unavailable;
    }

    # /api/version is a liveness probe (same failure mode as /api/health).
    # It must not sit on the 600s analytics read timeout.
    location = /api/version {
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_pass http://$openfdd_central;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $openfdd_forwarded_proto;
        proxy_intercept_errors on;
        error_page 502 503 504 = @central_unavailable;
    }

    # Login and auth status are interactive. A wedged central that accepts TCP
    # must not hold the demo form for the analytics read budget.
    location = /api/auth/status {
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
        proxy_pass http://$openfdd_central;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $openfdd_forwarded_proto;
        proxy_intercept_errors on;
        error_page 502 503 504 = @central_unavailable;
    }

    location = /api/auth/login {
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_pass http://$openfdd_central;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $openfdd_forwarded_proto;
        proxy_intercept_errors on;
        error_page 502 503 504 = @central_unavailable;
    }

    location @central_unavailable {
        internal;
        default_type application/json;
        # Local add_header drops server{} security headers (nginx inherit rule).
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $openfdd_hsts always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 503 '{"ok":false,"service":"openfdd-web","error":"central_unavailable"}';
    }

    # CSV / package import — preserve 128 MiB + long read for large zips / async jobs.
    location /api/csv/ {
        client_max_body_size 128m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_pass http://$openfdd_central;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $openfdd_forwarded_proto;
        proxy_intercept_errors off;
        # Restate HSTS/security headers so any future location add_header
        # cannot silently drop them (#1132).
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $openfdd_hsts always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Analytics / AFDD long polls — long read, moderate body.
    location /api/analytics/ {
        client_max_body_size 16m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_pass http://$openfdd_central;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $openfdd_forwarded_proto;
        proxy_intercept_errors off;
        # Restate edge headers: location add_header would otherwise drop them;
        # analytics is a common AF probe surface (#1132).
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $openfdd_hsts always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Same-origin /api → central. Tighter default limits than CSV/analytics.
    # With a variable upstream, a URI suffix on proxy_pass replaces the matched
    # location and doubles /api → /api/api/*. Pass the original request URI.
    location /api/ {
        client_max_body_size 16m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        proxy_pass http://$openfdd_central;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $openfdd_forwarded_proto;
        proxy_intercept_errors off;
        # Explicit HSTS on every /api/* proxy path (#1132) — AFDD/scheduler etc.
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $openfdd_hsts always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Unity WebGL builds served by central (same-origin).
    location /twins/ {
        proxy_pass http://$openfdd_central;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $openfdd_forwarded_proto;
        proxy_buffering off;
        # Unity WebGL may need wasm eval; SPA (above) does not use unsafe-eval.
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $openfdd_hsts always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # Bookmark alias — do not SPA-fallback /login to a blank React tree.
    location = /login {
        return 302 /auth;
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $openfdd_hsts always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Wave O2: security.txt must not SPA-fallback to HTML.
    location = /.well-known/security.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $openfdd_hsts always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $openfdd_hsts always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # Hashed Vite assets — immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $openfdd_hsts always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $openfdd_hsts always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
