<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open-FDD Lite chart</title>
<!--
  One Open-FDD Lite chart per window: chart.html?c=<id>&site=<siteRef>[&equip=<equipRef>][&h=<hours>][&point=<uuid>]
  Loads the Haystack model, then fetches ONLY this chart's points, resampled by NF
  (charts.js). Redraws every 5 min while the window is visible.
-->
<script src="theme-init.js"></script>
<script src="lite-theme.js"></script>
<script src="vendor/echarts.min.js"></script>  <!-- ECharts 6.1.0, served by NF: no internet needed -->
<script src="nf.js"></script>
<script src="model.js"></script>
<script src="charts.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1 id="title">⚡ Chart</h1>
    <div class="sub" id="sub">Loading the Haystack model…</div>
  </div>
  <div class="spacer"></div>
  <select id="pick" style="display:none"></select>
  <span class="seg" id="range" style="margin-left:0"></span>
  <span class="pill"><span class="dot" id="liveDot"></span><span id="liveTxt">connecting</span></span>
  <button class="btn" id="themeToggle" type="button">☾ dark</button>
  <a class="btn" id="back" href="index.html#charts">all charts</a>
</header>
<main>
  <div id="err"></div>
  <section class="panel">
    <h2><span class="hint" id="hint"></span></h2>
    <div class="chart full" id="chart"></div>
  </section>
</main>
<script src="chart-page.js"></script>
</body>
</html>
