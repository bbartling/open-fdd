[package]
name = "open_fdd_edge_prototype"
version = "4.0.4"
edition = "2021"

# Library only. The edge process and BACnet/Modbus/Haystack wire clients live
# under archive/ot-edge/unmaintained/edge.
# Central links this crate for package, semantic, and SQL FDD helpers.

# Wave-X: Timescale product path. DataFusion feature deleted (C2).
[features]
default = []

[lints]
workspace = true

[dependencies]
base64 = "0.22"
bcrypt = "0.16"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
hex = "0.4"
libc = "0.2"
hmac = "0.12"
rand = "0.8"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.2"
once_cell = "1.21.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
oxigraph = "0.5"
# Pin matches oxigraph 0.5.x transitive spargebra (DM-08 SELECT algebra allowlist).
spargebra = "=0.4.6"
fdd_core = { path = "../crates/fdd_core" }
fdd_rules = { path = "../crates/fdd_rules" }
fdd_resources = { path = "../crates/fdd_resources" }
fdd_store = { path = "../crates/fdd_store" }
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
