[package]
name = "open_fdd_edge_prototype"
version = "4.0.0"
edition = "2021"

[[bin]]
name = "open_fdd_edge_prototype"
path = "src/main.rs"
required-features = ["ot-transport"]

[[bin]]
name = "openfdd-edge"
path = "src/bin/openfdd_edge.rs"

[[bin]]
name = "haystack_c3_export_fixture"
path = "src/bin/haystack_c3_export_fixture.rs"

# Wave-X: Timescale product path. DataFusion feature deleted (C2).
[features]
# Default keeps the archived edge binary buildable. Product central depends on
# this crate with default-features = false so OT transport clients are not linked.
default = ["ot-transport"]
ot-transport = [
    "dep:rusty-haystack-client",
    "dep:rusty-haystack-core",
    "dep:rusty-modbus-client",
    "dep:rusty-modbus-types",
]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
  'cfg(feature, values("legacy-datafusion", "legacy-parquet"))',
] }

[dependencies]
# Arrow IPC remains for package CSV dataset pages (not product FDD engine).
arrow.workspace = true
base64 = "0.22"
bcrypt = "0.16"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
hex = "0.4"
libc = "0.2"
hmac = "0.12"
rand = "0.8"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# rusty-haystack v0.8.1 — latest tagged release (main 0.9.0 has rand/tungstenite resolve conflict).
rusty-haystack-client = { git = "https://github.com/jscott3201/rusty-haystack", rev = "d85e72271e789d3dcf4a90f79adb7d1556faae80", version = "0.8.1", optional = true }
rusty-haystack-core = { git = "https://github.com/jscott3201/rusty-haystack", rev = "d85e72271e789d3dcf4a90f79adb7d1556faae80", version = "0.8.1", optional = true }
toml = "1.1.2"
once_cell = "1.21.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rusty-modbus-client = { git = "https://github.com/jscott3201/rusty-modbus", rev = "57135620af03f291f85d71eca76f4c8fbe83b2c1", version = "0.1.1", optional = true }
rusty-modbus-types = { git = "https://github.com/jscott3201/rusty-modbus", rev = "57135620af03f291f85d71eca76f4c8fbe83b2c1", version = "0.1.1", optional = true }
oxigraph = "0.5"
# Pin matches oxigraph 0.5.x transitive spargebra (DM-08 SELECT algebra allowlist).
spargebra = "=0.4.6"
fdd_core = { path = "../crates/fdd_core" }
fdd_rules = { path = "../crates/fdd_rules" }
fdd_resources = { path = "../crates/fdd_resources" }
fdd_store = { path = "../crates/fdd_store" }
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
