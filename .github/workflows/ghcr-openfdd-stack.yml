# Publish Open-FDD 4.0 images to GHCR (central + rollback openfdd-web).
# Default product UI is static on central (/app/). openfdd-web stays published for rollback.
# This workflow does not publish openfdd-fieldbus or openfdd-mqtt.
# The Railway MQTT broker keeps its already-published image.
# Tag contract:
# - every publish: immutable sha-<7>
# - master: moving nightly + rerun-unique immutable run tag
# - v* release tag: stable semver + rerun-unique immutable run tag
# - manual non-master build: candidate-<7> + immutable sha only
name: Publish Open-FDD stack to GHCR

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ghcr-openfdd-stack
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/bbartling
  CENTRAL_IMAGE: ghcr.io/bbartling/openfdd-central
  WEB_IMAGE: ghcr.io/bbartling/openfdd-web

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openfdd
          POSTGRES_PASSWORD: openfdd
          POSTGRES_DB: openfdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfdd -d openfdd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (stack crates)
        run: cargo clippy -p openfdd-central -- -D warnings

      - name: Stack crate tests
        env:
          OPENFDD_TEST_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
        run: |
          set -euo pipefail
          cargo test -p openfdd-central r1484_execute_cycle_holds_checkpoint_until_interval_check_recovers -- --test-threads=1
          cargo test -p openfdd-central r_wave_d_multi_hour_earlier_chunk_holds_checkpoint -- --test-threads=1
          cargo test -p openfdd-central -- --skip fixture_acceptance --test-threads=2
          cargo test -p openfdd-central fixture_acceptance -- --test-threads=1

      - name: Ingest scope receipts (Postgres pass required)
        env:
          OPENFDD_TEST_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
          OPENFDD_INGEST_SCOPE_DATABASE_REQUIRED: "1"
        run: |
          set -euo pipefail
          cargo test -p openfdd-central ingest_idempotency_backfill_and_metrics_are_tenant_scoped -- --nocapture --test-threads=1 \
            2>&1 | tee scope_receipt.log
          grep -q 'SCOPE_TEST_RECEIPT phase=memory' scope_receipt.log
          grep -q 'SCOPE_TEST_RECEIPT phase=postgres' scope_receipt.log

      - name: In-process parallel ingest interaction (bounded)
        env:
          OPENFDD_TEST_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
          OPENFDD_INGEST_SCOPE_DATABASE_REQUIRED: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/ci/run_ingest_parallel_interaction_rounds.sh
          ./scripts/ci/run_ingest_parallel_interaction_rounds.sh

      - name: Static default portal + React rollback image
        run: |
          chmod +x scripts/ci/static_product_guard.sh
          ./scripts/ci/static_product_guard.sh
          test -f archive/product-ui/react-spa-v4/package.json
          test -f archive/product-ui/react-spa-v4/package-lock.json
          test -f archive/product-ui/react-spa-v4/Dockerfile
          test -f docker/compose.react.yml
          grep -q '3000:8080' docker/compose.react.yml
          ! test -d services/ui
          ! grep -qE 'openfdd-ui|services/ui|:8501' docker/compose.portal.yml docker/compose.central.yml docker/compose.csv.yml

      - name: Build openfdd-web image (no push)
        run: |
          docker build \
            --build-arg OPENFDD_GIT_SHA=ci-test \
            --build-arg OPENFDD_WEB_VERSION=0.0.0-ci \
            -t openfdd-web:ci \
            -f archive/product-ui/react-spa-v4/Dockerfile \
            archive/product-ui/react-spa-v4
          docker run --rm --entrypoint cat openfdd-web:ci /usr/share/nginx/html/version.json | grep openfdd-web
          docker run --rm --entrypoint sh openfdd-web:ci -c 'test -f /usr/share/nginx/html/index.html'
          ! docker run --rm --entrypoint sh openfdd-web:ci -c 'command -v python3 || command -v python' 2>/dev/null

      - name: Compose config check (all recipes)
        env:
          OPENFDD_JWT_SECRET: ci-compose-config-secret-not-for-prod
        run: |
          for f in docker/compose.portal.yml docker/compose.central.yml docker/compose.csv.yml docker/compose.react.yml; do
            docker compose -f "$f" config >/dev/null
            echo "OK config: $f"
          done
          bash -n scripts/openfdd_stack_lib.sh
          bash -n scripts/openfdd_stack_up.sh
          bash -n scripts/openfdd_stack_pull.sh

      - name: CSV recipe boot smoke (central static /app/)
        run: |
          chmod +x scripts/release/smoke_csv_central_boot.sh
          docker build -f services/central/Dockerfile -t openfdd-central:ci .
          export OPENFDD_CENTRAL_IMAGE=openfdd-central:ci
          export OPENFDD_SMOKE_SKIP_BUILD=1
          ./scripts/release/smoke_csv_central_boot.sh

  # Railway hub tip: central + web (amd64). The MQTT broker image is not rebuilt.
  # Job budget must cover central RocksDB/oxrocksdb link (often >90m cold) + web + mqtt.
  publish-hub:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          version="$(grep -E '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          suffixes=("sha-${short_sha}")
          nightly=false
          release=false
          candidate=false

          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            nightly=true
            suffixes+=("${version}-n${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}")
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release=true
            ref_version="${GITHUB_REF_NAME#v}"
            if [[ "${ref_version}" != "${version}" ]]; then
              echo "release tag v${ref_version} does not match Cargo.toml version ${version}" >&2
              exit 1
            fi
            suffixes+=("${version}" "${version}-n${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}")
          else
            candidate=true
            suffixes+=("candidate-${short_sha}")
          fi

          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "nightly=${nightly}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "candidate=${candidate}" >> "$GITHUB_OUTPUT"

          {
            echo "tag_suffixes<<EOF"
            printf '%s\n' "${suffixes[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          write_tags() {
            local key="$1"
            local image="$2"
            {
              echo "${key}<<EOF"
              for suffix in "${suffixes[@]}"; do
                echo "${image}:${suffix}"
              done
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }

          write_tags central_tags "$CENTRAL_IMAGE"
          write_tags web_tags "$WEB_IMAGE"

          echo "GHCR hub tag suffixes: ${suffixes[*]}"

      - name: Build and push openfdd-central
        uses: docker/build-push-action@v6
        # RocksDB via oxrocksdb is slow cold; amd64-only still regularly exceeds 90m.
        # Do not add an arm64 fieldbus publish to this 4.0 workflow.
        timeout-minutes: 240
        with:
          context: .
          file: services/central/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.central_tags }}
          build-args: |
            OPENFDD_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Open-FDD Central
            org.opencontainers.image.source=https://github.com/bbartling/open-fdd
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=openfdd-central
          cache-to: type=gha,mode=max,scope=openfdd-central

      - name: Tag openfdd-central nightly
        if: steps.vars.outputs.nightly == 'true'
        run: docker buildx imagetools create -t "${{ env.CENTRAL_IMAGE }}:nightly" "${{ env.CENTRAL_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}"

      - name: Build and push openfdd-web (React rollback image)
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: archive/product-ui/react-spa-v4
          file: archive/product-ui/react-spa-v4/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.web_tags }}
          build-args: |
            OPENFDD_GIT_SHA=${{ github.sha }}
            OPENFDD_WEB_VERSION=${{ steps.vars.outputs.version }}
            OPENFDD_IMAGE_TAG=sha-${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Open-FDD Web (React SPA)
            org.opencontainers.image.source=https://github.com/bbartling/open-fdd
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.description=Rollback-only React SPA — use docker/compose.react.yml; default portal UI is static on central /app/
          cache-from: type=gha,scope=openfdd-web
          cache-to: type=gha,mode=max,scope=openfdd-web

      - name: Tag openfdd-web nightly
        if: steps.vars.outputs.nightly == 'true'
        run: docker buildx imagetools create -t "${{ env.WEB_IMAGE }}:nightly" "${{ env.WEB_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}"

      - name: Verify product tags (central/web)
        env:
          TAG_SUFFIXES: ${{ steps.vars.outputs.tag_suffixes }}
        run: |
          set -euo pipefail
          for img in central web; do
            case "$img" in
              central) ref="${{ env.CENTRAL_IMAGE }}" ;;
              web) ref="${{ env.WEB_IMAGE }}" ;;
            esac
            while IFS= read -r suffix; do
              [[ -n "$suffix" ]] || continue
              docker buildx imagetools inspect "${ref}:${suffix}"
            done <<< "$TAG_SUFFIXES"
            if [[ "${{ steps.vars.outputs.nightly }}" == "true" ]]; then
              docker buildx imagetools inspect "${ref}:nightly"
            fi
          done
