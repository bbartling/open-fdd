# Publish Open-FDD stack images to GHCR (central, web, fieldbus, mqtt).
# Product UI is openfdd-web (React). openfdd-ui is no longer published.
# Nightly on master; semver + sha tags on every push to master or version tags.
name: Publish Open-FDD stack to GHCR

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ghcr-openfdd-stack
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/bbartling
  CENTRAL_IMAGE: ghcr.io/bbartling/openfdd-central
  WEB_IMAGE: ghcr.io/bbartling/openfdd-web
  FIELDBUS_IMAGE: ghcr.io/bbartling/openfdd-fieldbus
  MQTT_IMAGE: ghcr.io/bbartling/openfdd-mqtt

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (stack crates)
        run: cargo clippy -p openfdd-central -p openfdd-fieldbus -p openfdd_mqtt -- -D warnings

      - name: Stack crate tests
        run: cargo test -p openfdd-central -p openfdd-fieldbus -p openfdd_mqtt

      - name: Product UI present (React); Streamlit absent
        run: |
          test -f frontend/web/package.json
          test -f frontend/web/package-lock.json
          test -f frontend/web/Dockerfile
          test -f docker/compose.react.yml
          grep -q '3000:8080' docker/compose.react.yml
          ! test -d services/ui
          ! grep -q "streamlit-legacy" docker/compose.central.yml docker/compose.csv.yml docker/compose.standalone.yml

      - name: Build openfdd-web image (no push)
        run: |
          docker build \
            --build-arg OPENFDD_GIT_SHA=ci-test \
            --build-arg OPENFDD_WEB_VERSION=0.0.0-ci \
            -t openfdd-web:ci \
            -f frontend/web/Dockerfile \
            frontend/web
          docker run --rm --entrypoint cat openfdd-web:ci /usr/share/nginx/html/version.json | grep openfdd-web
          ! docker run --rm --entrypoint sh openfdd-web:ci -c 'command -v python3 || command -v python' 2>/dev/null

      - name: Compose config check (all recipes)
        env:
          OPENFDD_SITE_ID: local
          OPENFDD_EDGE_ID: fieldbus-1
          OPENFDD_MQTT_HOST: 127.0.0.1
          OPENFDD_JWT_SECRET: ci-compose-config-secret-not-for-prod
        run: |
          mkdir -p deploy/mqtt/kits/local__fieldbus-1
          export OPENFDD_EDGE_KIT_DIR="$PWD/deploy/mqtt/kits/local__fieldbus-1"
          for f in docker/compose.standalone.yml docker/compose.central.yml docker/compose.edge.yml docker/compose.csv.yml docker/compose.react.yml docker/compose.react.fieldbus.yml; do
            docker compose -f "$f" config >/dev/null
            echo "OK config: $f"
          done
          chmod +x scripts/release/smoke_standalone_mqtts.sh
          ./scripts/release/smoke_standalone_mqtts.sh
          bash -n scripts/openfdd_stack_lib.sh
          bash -n scripts/openfdd_stack_up.sh
          bash -n scripts/openfdd_stack_pull.sh

      - name: CSV recipe boot smoke (central + React web)
        run: |
          chmod +x scripts/release/smoke_csv_central_boot.sh
          ./scripts/release/smoke_csv_central_boot.sh

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: vars
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          version="$(grep -E '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          else
            echo "nightly=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push openfdd-central
        uses: docker/build-push-action@v6
        # RocksDB via oxrocksdb + QEMU arm64 exceeds 2h; ship amd64 nightly first for local MQTTS tests.
        timeout-minutes: 240
        with:
          context: .
          file: services/central/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CENTRAL_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
            ${{ env.CENTRAL_IMAGE }}:${{ steps.vars.outputs.version }}
          build-args: |
            OPENFDD_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Open-FDD Central
            org.opencontainers.image.source=https://github.com/bbartling/open-fdd
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=openfdd-central
          cache-to: type=gha,mode=max,scope=openfdd-central

      - name: Tag openfdd-central nightly
        if: steps.vars.outputs.nightly == 'true'
        run: docker buildx imagetools create -t "${{ env.CENTRAL_IMAGE }}:nightly" "${{ env.CENTRAL_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}"

      - name: Build and push openfdd-web (React product UI)
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: frontend/web
          file: frontend/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
            ${{ env.WEB_IMAGE }}:${{ steps.vars.outputs.version }}
          build-args: |
            OPENFDD_GIT_SHA=${{ github.sha }}
            OPENFDD_WEB_VERSION=${{ steps.vars.outputs.version }}
          labels: |
            org.opencontainers.image.title=Open-FDD Web (React SPA)
            org.opencontainers.image.source=https://github.com/bbartling/open-fdd
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.description=Supported product UI — nginx SPA proxying /api to central
          cache-from: type=gha,scope=openfdd-web
          cache-to: type=gha,mode=max,scope=openfdd-web

      - name: Tag openfdd-web nightly
        if: steps.vars.outputs.nightly == 'true'
        run: docker buildx imagetools create -t "${{ env.WEB_IMAGE }}:nightly" "${{ env.WEB_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}"

      - name: Build and push openfdd-fieldbus
        uses: docker/build-push-action@v6
        timeout-minutes: 240
        with:
          context: .
          file: services/fieldbus/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FIELDBUS_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
            ${{ env.FIELDBUS_IMAGE }}:${{ steps.vars.outputs.version }}
          labels: |
            org.opencontainers.image.title=Open-FDD Fieldbus
            org.opencontainers.image.source=https://github.com/bbartling/open-fdd
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=openfdd-fieldbus
          cache-to: type=gha,mode=max,scope=openfdd-fieldbus

      - name: Tag openfdd-fieldbus nightly
        if: steps.vars.outputs.nightly == 'true'
        run: docker buildx imagetools create -t "${{ env.FIELDBUS_IMAGE }}:nightly" "${{ env.FIELDBUS_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}"

      - name: Build and push openfdd-mqtt
        uses: docker/build-push-action@v6
        timeout-minutes: 15
        with:
          context: services/mqtt
          file: services/mqtt/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.MQTT_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
            ${{ env.MQTT_IMAGE }}:${{ steps.vars.outputs.version }}
          labels: |
            org.opencontainers.image.title=Open-FDD MQTT Broker
            org.opencontainers.image.source=https://github.com/bbartling/open-fdd
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=openfdd-mqtt
          cache-to: type=gha,mode=max,scope=openfdd-mqtt

      - name: Tag openfdd-mqtt nightly
        if: steps.vars.outputs.nightly == 'true'
        run: docker buildx imagetools create -t "${{ env.MQTT_IMAGE }}:nightly" "${{ env.MQTT_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}"

      - name: Published tags
        run: |
          set -euo pipefail
          for img in central web fieldbus mqtt; do
            case "$img" in
              central) ref="${{ env.CENTRAL_IMAGE }}" ;;
              web) ref="${{ env.WEB_IMAGE }}" ;;
              fieldbus) ref="${{ env.FIELDBUS_IMAGE }}" ;;
              mqtt) ref="${{ env.MQTT_IMAGE }}" ;;
            esac
            docker buildx imagetools inspect "${ref}:sha-${{ steps.vars.outputs.short_sha }}"
            docker buildx imagetools inspect "${ref}:${{ steps.vars.outputs.version }}"
            if [[ "${{ steps.vars.outputs.nightly }}" == "true" ]]; then
              docker buildx imagetools inspect "${ref}:nightly"
            fi
          done
