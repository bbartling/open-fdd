# Offline Pandas parity checks for cookbook fixtures (docs-only, no edge runtime).

name: Cookbook parity

on:
  push:
    branches: [master, main]
    paths:
      - "docs/rules/cookbook/**"
      - "docs/migration/MILESTONE_A_CLOSEOUT.md"
      - "docs/migration/react-rust/**"
      - "openfdd_agent_spec/ownership.yaml"
      - "scripts/cookbook_parity_check.py"
      - "scripts/rule_parity_mutation_check.py"
      - "scripts/architecture_ownership_check.py"
      - "scripts/architecture_react_policy_check.py"
      - "scripts/validate_capabilities_ledger.py"
      - "docs/architecture/adr-001-react-rust-modernization.md"
      - "sql_rules/registry.yaml"
      - "docs/migration/MILESTONE_D_RULE_PARITY.md"
      - ".github/workflows/cookbook-parity.yml"
      - "README.md"
  pull_request:
    branches: [master, main]
    paths:
      - "docs/rules/cookbook/**"
      - "docs/migration/MILESTONE_A_CLOSEOUT.md"
      - "docs/migration/react-rust/**"
      - "openfdd_agent_spec/ownership.yaml"
      - "scripts/cookbook_parity_check.py"
      - "scripts/rule_parity_mutation_check.py"
      - "scripts/architecture_ownership_check.py"
      - "scripts/architecture_react_policy_check.py"
      - "scripts/validate_capabilities_ledger.py"
      - "docs/architecture/adr-001-react-rust-modernization.md"
      - "sql_rules/registry.yaml"
      - "docs/migration/MILESTONE_D_RULE_PARITY.md"
      - ".github/workflows/cookbook-parity.yml"
      - "README.md"

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandas + PyYAML
        run: pip install pandas pyyaml

      - name: Architecture ownership + React policy + capability ledger
        run: |
          python3 scripts/architecture_ownership_check.py
          python3 scripts/architecture_react_policy_check.py
          python3 scripts/validate_capabilities_ledger.py

      - name: Rule parity mutation path checks (D2)
        run: python3 scripts/rule_parity_mutation_check.py

      - name: Run cookbook fixture checks
        run: python3 scripts/cookbook_parity_check.py --all
