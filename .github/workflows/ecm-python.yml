# Compatibility alias — canonical workflow is python-package.yml
name: ECM Python package

on:
  push:
    paths:
      - "open_fdd/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ecm-python.yml"
  pull_request:
    paths:
      - "open_fdd/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ecm-python.yml"

permissions:
  contents: read

jobs:
  ecm-package:
    name: pytest + wheel (alias)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev]" build twine
          python scripts/release/check_version.py
          python -m pytest tests/ecm tests/rules tests/analytics tests/reporting -q
          rm -rf dist build *.egg-info
          python -m build
          wheel="$(ls -1t dist/*.whl | head -n 1)"
          python -m zipfile -l "$wheel" | grep cookbook_catalog
