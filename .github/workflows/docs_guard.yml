name: docs-guard

on:
  pull_request:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard protected docs
        run: bash scripts/guard_docs.sh

  pr3-clippy-fix:
    if: github.head_ref == 'feat/backend-overview-health-apis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-overview-health-apis
          fetch-depth: 0
      - name: Apply PR3 Clippy fixes
        run: |
          python3 scripts/pr3_clippy_fix.py
          rm scripts/pr3_clippy_fix.py
          git fetch origin master
          git checkout origin/master -- .github/workflows/docs_guard.yml
          cargo fmt --all
          git diff --check
          git config user.name "openfdd-pr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/central/src/analytics/plant_health.rs .github/workflows/docs_guard.yml scripts/pr3_clippy_fix.py
          git commit -m "Fix Overview health Clippy findings"
          git push origin HEAD:feat/backend-overview-health-apis
