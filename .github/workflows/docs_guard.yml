name: docs-guard

on:
  pull_request:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard protected docs
        run: bash scripts/guard_docs.sh

  pr2-clippy-fix:
    if: github.head_ref == 'feat/equipment-type-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/equipment-type-contract
          fetch-depth: 0
      - name: Apply scoped PR2 Clippy fixes
        shell: bash
        run: |
          python3 scripts/pr2_clippy_fix.py
          rm -f scripts/pr2_clippy_fix.py
          git fetch origin master
          git checkout origin/master -- .github/workflows/docs_guard.yml
          cargo fmt --all
          git diff --check
          git config user.name "open-fdd automation"
          git config user.email "actions@users.noreply.github.com"
          git add services/central/src/analytics/plant_health.rs services/central/src/analytics/historian.rs .github/workflows/docs_guard.yml scripts/pr2_clippy_fix.py
          git commit -m "Fix PR2 Rust Clippy findings"
          git push origin HEAD:feat/equipment-type-contract
