name: si-parity

on:
  push:
    branches: [master, main]
    paths:
      - "scripts/ci/check_ip_goldens_frozen.py"
      - "scripts/stress/si_cutover/**"
      - "sql/fdd/registry.yaml"
      - "sql/fdd/postgres/rules/**"
      - "sql/fdd/tuning_catalog.json"
      - "open_fdd/rules/**"
      - "scripts/qualification/**"
      - "sql/fdd/**"
      - "open_fdd/**"
      - "tests/fixtures/si_cutover/**"
      - "tests/qualification/test_mode_delay_consolidation_1437.py"
      - "tests/qualification/fc1_mode_delay_timeline_reference.py"
      - "tests/qualification/test_mode_delay_shared.py"
      - "tests/qualification/test_sql407_verifier_regressions.py"
      - "tests/qualification/test_baseline_manifest_integrity.py"
      - "tests/qualification/test_capture_fdd_isolation_postgres.py"
      - "tests/qualification/test_w4f_analytics_si.py"
      - "tests/qualification/test_w4f_analytics_threshold_invariance.py"
      - "tests/qualification/test_fc6_flow_default_coherence.py"
      - "tests/qualification/fc6_flow_boundary_reference.py"
      - "tests/units/test_lps_per_cfm_contract.py"
      - "scripts/ci/check_unit_contract.py"
      - "scripts/ci/unit_contract_lib.py"
      - "sql/contract/goldens/**"
      - "docs/rules/cookbook/fixtures/**"
      - "sql/analytics/**"
      - "open_fdd/analytics/**"
      - "services/central/src/analytics/**"
      - "services/central/src/timescale_analytics.rs"
      - ".github/workflows/si-parity.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "scripts/ci/check_ip_goldens_frozen.py"
      - "scripts/stress/si_cutover/**"
      - "sql/fdd/registry.yaml"
      - "sql/fdd/postgres/rules/**"
      - "sql/fdd/tuning_catalog.json"
      - "open_fdd/rules/**"
      - "scripts/qualification/**"
      - "sql/fdd/**"
      - "open_fdd/**"
      - "tests/fixtures/si_cutover/**"
      - "tests/qualification/test_mode_delay_consolidation_1437.py"
      - "tests/qualification/fc1_mode_delay_timeline_reference.py"
      - "tests/qualification/test_mode_delay_shared.py"
      - "tests/qualification/test_sql407_verifier_regressions.py"
      - "tests/qualification/test_baseline_manifest_integrity.py"
      - "tests/qualification/test_capture_fdd_isolation_postgres.py"
      - "tests/qualification/test_w4f_analytics_si.py"
      - "tests/qualification/test_w4f_analytics_threshold_invariance.py"
      - "tests/qualification/test_fc6_flow_default_coherence.py"
      - "tests/qualification/fc6_flow_boundary_reference.py"
      - "tests/units/test_lps_per_cfm_contract.py"
      - "scripts/ci/check_unit_contract.py"
      - "scripts/ci/unit_contract_lib.py"
      - "sql/contract/goldens/**"
      - "sql/fdd/**"
      - "open_fdd/**"
      - "docs/rules/cookbook/fixtures/**"
      - "sql/analytics/**"
      - "open_fdd/analytics/**"
      - "services/central/src/analytics/**"
      - "services/central/src/timescale_analytics.rs"
      - ".github/workflows/si-parity.yml"

concurrency:
  group: si-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  si-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      timescale:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: openfdd
          POSTGRES_PASSWORD: openfdd
          POSTGRES_DB: openfdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfdd -d openfdd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPENFDD_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
      OPENFDD_P1_REQUIRE_EXTERNAL_IDENTITY_PINS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Pin external P1 candidate identity (outside parity_chain)
        run: |
          rev="$(git rev-parse HEAD)"
          tree="$(python3 -c "from pathlib import Path; from scripts.stress.si_cutover.p1_candidate_identity import compute_repo_candidate_pins; print(compute_repo_candidate_pins(Path('.'))[1])")"
          echo "OPENFDD_P1_EXPECTED_CANDIDATE_REV=${rev}" >> "$GITHUB_ENV"
          echo "OPENFDD_P1_EXPECTED_OPEN_FDD_TREE_SHA256=${tree}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness deps
        run: |
          python -m pip install -U pip
          pip install 'psycopg[binary]>=3.1'
          pip install pyyaml
          pip install -e ".[oracle]"

      - name: No-imperial product guard
        run: bash scripts/ci/check_no_imperial_product.sh

      - name: Unit contract (T1284-1 baseline)
        run: python3 scripts/ci/check_unit_contract.py

      - name: LPS per cfm contract unit tests (T1284 FC6 law)
        run: python3 -m pytest tests/units/test_lps_per_cfm_contract.py -v

      - name: Frozen ip goldens (Timescale regen must match committed)
        run: python3 scripts/ci/check_ip_goldens_frozen.py

      - name: SI parity full matrix (report-only) + artifact
        run: |
          python3 scripts/stress/si_parity_gate.py --fixtures-only \
            --report-json si_parity_report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("si_parity_report.json").read_text())
          p0 = doc["stages"]["P0"]
          p1 = doc["stages"]["P1"]
          an = doc["analytics"]["stages"]
          print(
              f"P0 comparisons={p0['comparisons']} mismatches={p0['mismatch_count']} "
              f"by_kind={p0['by_kind']}"
          )
          print(
              f"P1 comparisons={p1['comparisons']} mismatches={p1['mismatch_count']} "
              f"by_rule={p1['by_rule_id']}"
          )
          for name, st in sorted(an.items()):
              print(f"{name} comparisons={st['comparisons']} mismatches={st['mismatch_count']}")
          PY

      - name: Upload si_parity_report.json
        uses: actions/upload-artifact@v4
        with:
          name: si-parity-report
          path: si_parity_report.json

      - name: Blocking W4a FC AHU scope (clean)
        run: |
          python3 scripts/stress/si_parity_gate.py --fixtures-only --blocking \
            --family W4a_si_ahu_fc

      - name: Blocking W4c zone/VAV/FCU scope (clean)
        run: |
          python3 scripts/stress/si_parity_gate.py --fixtures-only --blocking \
            --family W4c_si_zone

      - name: Blocking W4b AHU econ SI family (P1/P2 scope)
        run: |
          python3 scripts/stress/si_parity_gate.py --fixtures-only --blocking \
            --family W4b_ahu_econ

      - name: Blocking W4d plant scope (clean)
        run: |
          python3 scripts/stress/si_parity_gate.py --fixtures-only --blocking \
            --family W4d_si_plant

      - name: Blocking W4e sensor/weather/schedule/utility SI family (clean)
        run: |
          python3 scripts/stress/si_parity_gate.py --fixtures-only --blocking \
            --family W4e_si_sensor_util

      - name: Blocking W4f analytics family (19 queries, P1/P2-analytics)
        run: |
          python3 scripts/stress/si_parity_gate.py --fixtures-only --blocking \
            --family W4f_analytics_si_p2

      - name: W4f analytics SI (offline P1/P2 + live SQL SI golden check)
        env:
          OPENFDD_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
        run: >-
          python3 -B -m unittest
          tests.qualification.test_w4f_analytics_si
          tests.qualification.test_w4f_analytics_threshold_invariance -v

      - name: T1284-4 blocking FC1 mutation must fail gate
        run: |
          set +e
          python3 scripts/stress/si_parity_gate.py --fixtures-only --blocking --rules FC1 \
            --inject-t1284-4-mutation
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 under mutation, got $code"
            exit 1
          fi

      - name: T1284-4 blocking W4f analytics mutation must fail gate
        run: |
          set +e
          python3 scripts/stress/si_parity_gate.py --fixtures-only --blocking \
            --family W4f_analytics_si_p2 --inject-t1284-4-mutation
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 under mutation, got $code"
            exit 1
          fi

      - name: T1284-4 unit-vector + FC1 + analytics probe self-test
        run: python3 scripts/stress/si_parity_gate.py --mutation-self-test

      - name: SI cutover verifier regressions (SQL407 / C0)
        run: |
          python3 -B -m unittest \
            tests.qualification.test_sql407_verifier_regressions \
            tests.qualification.test_baseline_manifest_integrity \
            tests.qualification.test_capture_fdd_isolation_postgres \
            tests.qualification.test_mode_delay_shared \
            tests.qualification.test_mode_delay_consolidation_1437 \
            tests.qualification.test_fc6_flow_default_coherence -v

      - name: Qualification unit tests
        run: python3 -B -m unittest discover -s tests/qualification -p 'test_si_parity*.py' -v
