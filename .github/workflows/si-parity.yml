name: si-parity

on:
  push:
    branches: [master, main]
    paths:
      - "scripts/stress/**"
      - "scripts/qualification/**"
      - "tests/fixtures/si_cutover/**"
      - "tests/qualification/test_si_parity_chain.py"
      - "sql/contract/goldens/**"
      - "docs/rules/cookbook/fixtures/**"
      - ".github/workflows/si-parity.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "scripts/stress/**"
      - "scripts/qualification/**"
      - "tests/fixtures/si_cutover/**"
      - "tests/qualification/test_si_parity_chain.py"
      - "sql/contract/goldens/**"
      - "docs/rules/cookbook/fixtures/**"
      - ".github/workflows/si-parity.yml"

concurrency:
  group: si-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  si-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness deps
        run: |
          python -m pip install -U pip
          pip install pyyaml
          pip install -e ".[oracle]"

      - name: Unit contract (T1284-1 baseline)
        run: python3 scripts/ci/check_unit_contract.py

      - name: SI parity chain P0–P2 on fixtures
        run: python3 scripts/stress/si_parity_gate.py --fixtures-only

      - name: T1284-4 mutation must fail parity
        run: python3 scripts/stress/si_parity_gate.py --mutation-self-test

      - name: Qualification unit tests
        run: python3 -B -m unittest discover -s tests/qualification -p 'test_si_parity*.py' -v
