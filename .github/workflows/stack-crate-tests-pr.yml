# Mirrors ghcr-openfdd-stack.yml "Stack crate tests" on PRs that touch central,
# so master-only publish does not hide fixture schema gaps.
name: Stack crate tests (PR parity)

on:
  pull_request:
    paths:
      - "services/central/**"
      - ".github/workflows/stack-crate-tests-pr.yml"
  push:
    branches: [master]
    paths:
      - "services/central/**"
      - ".github/workflows/stack-crate-tests-pr.yml"

permissions:
  contents: read

jobs:
  test:
    name: Stack crate tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openfdd
          POSTGRES_PASSWORD: openfdd
          POSTGRES_DB: openfdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfdd -d openfdd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Stack crate tests
        env:
          OPENFDD_TEST_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
        run: |
          cargo test -p openfdd-central -- --skip fixture_acceptance
          cargo test -p openfdd-central fixture_acceptance -- --test-threads=1

      - name: T1423 ingest Postgres stress (30x, parallel)
        env:
          OPENFDD_TEST_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            echo "=== T1423 ingest_queue repeat ${i}/30 ==="
            cargo test -p openfdd-central ingest_queue::t1423 --
          done
          echo "T1423 ingest_queue 30x parallel loop complete"
