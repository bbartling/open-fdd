name: Stack crate tests (PR parity)

# Mirrors ghcr-openfdd-stack.yml "Stack crate tests" on PRs that touch central,
# so master-only publish does not hide fixture schema gaps.
on:
  pull_request:
    paths:
      - "services/central/**"
      - ".github/workflows/stack-crate-tests-pr.yml"
  push:
    branches: [master]
    paths:
      - "services/central/**"
      - ".github/workflows/stack-crate-tests-pr.yml"

permissions:
  contents: read

jobs:
  test:
    name: Stack crate tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openfdd
          POSTGRES_PASSWORD: openfdd
          POSTGRES_DB: openfdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfdd -d openfdd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Stack crate tests
        env:
          OPENFDD_TEST_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
        run: |
          set -euo pipefail
          cargo test -p openfdd-central up03_postgres_exact_daily_buckets_from_confirmed_series -- --nocapture --test-threads=1
          cargo test -p openfdd-central up03_postgres_integration_ci -- --nocapture --test-threads=1
          cargo test -p openfdd-central -- --skip fixture_acceptance --skip up03_postgres_exact_daily_buckets_from_confirmed_series --skip up03_postgres_integration_ci --skip t1423_6 --skip t1499 --skip t1501 --test-threads=2
          cargo test -p openfdd-central t1423_6 -- --test-threads=1
          cargo test -p openfdd-central fixture_acceptance -- --test-threads=1

      - name: T1423 ingest Postgres stress (30x, parallel)
        env:
          OPENFDD_TEST_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            echo "=== T1423 ingest_queue repeat ${i}/30 ==="
            cargo test -p openfdd-central ingest_queue::t1423 --
          done
          echo "T1423 ingest_queue 30x parallel loop complete"

      - name: Ingest scope receipts (Postgres pass required)
        env:
          OPENFDD_TEST_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
          OPENFDD_INGEST_SCOPE_DATABASE_REQUIRED: "1"
        run: |
          set -euo pipefail
          cargo test -p openfdd-central ingest_idempotency_backfill_and_metrics_are_tenant_scoped -- --nocapture --test-threads=1 \
            2>&1 | tee scope_receipt.log
          grep -q 'SCOPE_TEST_RECEIPT phase=memory' scope_receipt.log
          grep -q 'SCOPE_TEST_RECEIPT phase=postgres' scope_receipt.log

      - name: In-process parallel ingest interaction (bounded)
        env:
          OPENFDD_TEST_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
          OPENFDD_INGEST_SCOPE_DATABASE_REQUIRED: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/ci/run_ingest_parallel_interaction_rounds.sh
          ./scripts/ci/run_ingest_parallel_interaction_rounds.sh
