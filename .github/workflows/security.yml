name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: pandas == SQL parity
    uses: ./.github/workflows/parity.yml

  npm-audit:
    name: npm audit (nf-app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        working-directory: nf-app
        run: npm audit --audit-level=high

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pin the scan to the commit SHAs from this workflow event rather than
      # asking an action to recalculate a moving PR's head via the GitHub API.
      - name: Resolve immutable commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$PR_BASE" "$PR_HEAD"
            base="$(git merge-base "$PR_BASE" "$PR_HEAD")"
            head="$PR_HEAD"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            git fetch --no-tags origin "$PUSH_BEFORE" "$EVENT_HEAD"
            base="$PUSH_BEFORE"
            head="$EVENT_HEAD"
          else
            # Manual and scheduled runs must scan actual history, not silently skip.
            echo "log_opts=--all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$base^{commit}"
          git cat-file -e "$head^{commit}"
          echo "log_opts=$base..$head" >> "$GITHUB_OUTPUT"

      # Use the CLI so a PR updated during a scan cannot change its range.
      # Preserve full-history checks for scheduled/manual runs.
      - name: Scan committed changes for secrets
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --config /repo/.gitleaks.toml --redact --verbose \
            --log-opts="$LOG_OPTS" /repo

  zap-baseline:
    name: ZAP baseline (mock NF server)
    needs: parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start the mock NF server
        run: |
          node nf-app/dev/mock-nf.mjs 8765 > mock-nf.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/v1/apps/static/open-fdd/ >/dev/null && exit 0
            sleep 1
          done
          cat mock-nf.log
          exit 1

      # The action runs ZAP in Docker with host networking, so 127.0.0.1 reaches the mock.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:8765/api/v1/apps/static/open-fdd/"
          cmd_options: "-a"
          # Accepted-by-design alerts, each with its reason (anything new still fails).
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true

      - name: Keep ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: ignore
