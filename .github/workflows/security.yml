name: Stack Security Guards

on:
  pull_request:
  push:
    branches: [ master, main ]

jobs:
  deny-old-python-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure slim PyPI shape (ECM + oracle libs; no old FDD wheel surface)
        run: |
          test -f pyproject.toml
          test -d open_fdd
          test -d open_fdd/ecm_engineering
          test -f open_fdd/ecm_engineering/data/Open_FDD_ECM_Engineering_Toolkit.xlsx
          test -f open_fdd/ecm_engineering/data/open_fdd_model.json
          test -d open_fdd/rules
          test -d open_fdd/analytics
          test -d open_fdd/reporting
          test -f open_fdd/rules/cookbook_catalog.py
          # Old Arrow/pandas FDD wheel surface must stay deleted.
          test ! -d open_fdd/arrow_runtime
          test ! -d open_fdd/playground
          test ! -d open_fdd/faults
          test ! -f requirements.txt
          test ! -d bacnet_toolshed
          grep -q 'name = "open-fdd"' pyproject.toml
          grep -q 'ecm_engineering' pyproject.toml
          grep -q 'oracle' pyproject.toml

      - name: Ensure safety docs exist
        run: |
          test -f AGENTS.md
          grep -q "Never" AGENTS.md

      - name: Keep NF app + archive layout
        run: |
          test -f Cargo.toml
          test -f .env.example
          test -d nf-app
          test -f nf-app/app.json
          test -d archive/central-v4
          test -d archive/product-ui/react-spa-v4
          test ! -d services/central
          test ! -d edge
          test ! -d mcp
