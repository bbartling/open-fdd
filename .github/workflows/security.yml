name: Stack Security Guards

on:
  pull_request:
  push:
    branches: [ master, main ]

jobs:
  deny-old-python-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure slim PyPI shape (ECM + oracle libs; no old FDD wheel surface)
        run: |
          test -f pyproject.toml
          test -d open_fdd
          test -d open_fdd/ecm_engineering
          test -f open_fdd/ecm_engineering/data/Open_FDD_ECM_Engineering_Toolkit.xlsx
          test -f open_fdd/ecm_engineering/data/open_fdd_model.json
          test -d open_fdd/rules
          test -d open_fdd/analytics
          test -d open_fdd/reporting
          test -f open_fdd/rules/cookbook_catalog.py
          # Old Arrow/pandas FDD wheel surface must stay deleted.
          test ! -d open_fdd/arrow_runtime
          test ! -d open_fdd/playground
          test ! -d open_fdd/faults
          test ! -f requirements.txt
          test ! -d bacnet_toolshed
          grep -q 'name = "open-fdd"' pyproject.toml
          grep -q 'ecm_engineering' pyproject.toml
          grep -q 'oracle' pyproject.toml

      - name: Ensure safety docs exist
        run: |
          test -f AGENTS.md
          grep -q "Never" AGENTS.md

      - name: Keep container stack focused
        run: |
          test -f Cargo.toml
          test -f docker/compose.standalone.yml
          test -f docker/compose.csv.yml
          test -f docker/compose.react.yml
          test -f services/central/Dockerfile
          test -f frontend/web/package.json
          test -f frontend/web/Dockerfile
          ! test -d services/ui
          test -f Dockerfile.mcp
          test -f .env.example
          test -d edge
          test -d services/central
          test -d frontend/web
          test -d workspace
          test ! -f Dockerfile
          test ! -f docker/compose.edge.rust.yml
          test ! -d workspace/dashboard/src

      - name: React sole product UI
        run: |
          ! test -f workspace/dashboard/package.json
          ! test -d services/ui
          ! grep -qE 'openfdd-ui|services/ui|:8501' docker/compose.central.yml docker/compose.csv.yml docker/compose.standalone.yml
          test -f docs/architecture/adr-001-react-rust-modernization.md
          python3 scripts/architecture_react_policy_check.py
          python3 -m pip install --user PyYAML
          python3 scripts/validate_capabilities_ledger.py
          python3 scripts/phase2_computation_policy_check.py
          python3 scripts/phase2_shadow_compare.py
