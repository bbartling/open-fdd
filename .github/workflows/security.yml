name: Security

on:
  push:
    branches: [master, "release/**"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  parity:
    name: pandas == SQL parity
    uses: ./.github/workflows/parity.yml

  npm-audit:
    name: npm audit (nf-app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit
        working-directory: nf-app
        run: npm audit --audit-level=high

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zap-baseline:
    name: ZAP baseline (mock NF server)
    if: github.event_name != 'pull_request' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Start the mock NF server
        run: |
          node nf-app/dev/mock-nf.mjs 8765 > mock-nf.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/v1/apps/static/open-fdd/ >/dev/null && exit 0
            sleep 1
          done
          cat mock-nf.log
          exit 1

      # The action runs ZAP in Docker with host networking, so 127.0.0.1 reaches the mock.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8765/api/v1/apps/static/open-fdd/"
          cmd_options: "-a"
          # Accepted-by-design alerts, each with its reason (anything new still fails).
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true

      - name: Keep ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: ignore
