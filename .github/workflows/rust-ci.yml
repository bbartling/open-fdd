# Canonical PR/push gate for the Open-FDD container stack.
# FDD engine path-scoped gate: fdd-engine-ci.yml
# Nightly stack publish: ghcr-openfdd-stack.yml
# MCP publish: rust-ghcr-mcp.yml
name: Rust Stack CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, clippy, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openfdd
          POSTGRES_PASSWORD: openfdd
          POSTGRES_DB: openfdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfdd -d openfdd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: VERSION matches workspace Cargo.toml
        run: |
          bash -n scripts/check_version_sync.sh
          ./scripts/check_version_sync.sh
          bash -n scripts/test_ghcr_prune_archive_keep.sh
          ./scripts/test_ghcr_prune_archive_keep.sh
          python3 scripts/test_ghcr_newest_by_created.py
          bash -n scripts/test_data_safe_defaults.sh
          ./scripts/test_data_safe_defaults.sh
          python3 scripts/timescale/test_data_safe_seed.py
          python3 scripts/archive/verify_ot_edge_snapshot.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Dependency guard (cargo tree errors fail)
        run: |
          bash scripts/ci/test_forbid_datafusion_product.sh
          bash scripts/ci/real_stack_browser.sh --self-test

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Edge lib and MCP tests
        run: cargo test --all-targets -p open_fdd_edge_prototype -p openfdd-mcp -- --test-threads=1

      - name: NF offline fixture acceptance (no live portal)
        run: |
          python3 scripts/nf/check_wave_nf_status.py
          if grep -nE 'reqwest|NfPortalDriver|https?://' services/central/src/providers/fixture_acceptance.rs; then
            echo "fixture acceptance must stay offline"
            exit 1
          fi
          cargo test -p openfdd-central fixture_acceptance -- --test-threads=1

      - name: Central / fieldbus / MQTT contract tests
        env:
          OPENFDD_TEST_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
        run: |
          cargo test -p openfdd_contracts -p fdd_resources -p openfdd-central -- --skip fixture_acceptance
          cargo test -p openfdd-central --test csv_fdd_integration
          cargo test -p openfdd-central --test jobs_api_integration -- --test-threads=1

      - name: Architecture / MQTT cutover gates
        run: bash scripts/gates/run_all_gates.sh --quick

      - name: Cookbook + README docs integrity (59-rule floor, cookbook link)
        run: python3 scripts/cookbook_parity_check.py --docs-only

      - name: Anti-hardcoding audit
        run: bash -n scripts/audit_no_private_bench_hardcoding.sh && ./scripts/audit_no_private_bench_hardcoding.sh

      - name: Secret scan
        run: |
          ! git ls-files | xargs grep -l 'OFDD_AUTH_SECRET=.' 2>/dev/null | grep -v '.example' | grep -v 'site_lib'
          test -f .gitignore
          grep -q 'auth.env.local' .gitignore || grep -q '/workspace' .gitignore

  frontend:
    name: Product UI guards (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: React sole product UI
        run: |
          test -f frontend/web/package.json
          test -f frontend/web/Dockerfile
          test -f docker/compose.react.yml
          ! test -d services/ui
          ! grep -qE 'openfdd-ui|services/ui|:8501' docker/compose.portal.yml docker/compose.central.yml docker/compose.csv.yml
          ! test -d workspace/dashboard/src
          ! test -f workspace/dashboard/package.json

      - name: Product tree guards
        run: |
          test -f .env.example
          test -x scripts/audit_no_private_bench_hardcoding.sh
          ./scripts/audit_no_private_bench_hardcoding.sh
          test -f VERSION
          grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' VERSION
          test ! -d services/fieldbus
          test ! -d services/mqtt
          test ! -d crates/openfdd_mqtt
          test -f archive/ot-edge/unmaintained/crates/openfdd_mqtt/Cargo.toml

  react-web:
    name: React web (frontend/web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: typecheck, lint, test, build
        working-directory: frontend/web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test
          npm run build
      - name: architecture policy + capability ledger
        run: |
          python3 -m pip install --user PyYAML
          python3 scripts/architecture_react_policy_check.py
          python3 scripts/validate_capabilities_ledger.py

  react-real-stack-browser:
    name: Real-stack browser tests
    # pull_request plus master. A branch push would otherwise run this twice.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install Playwright
        working-directory: frontend/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Free runner disk for the local image build
        run: |
          docker system prune -af
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Disposable compose stack and required browser assertions
        run: bash scripts/ci/real_stack_browser.sh

  docker:
    name: Stack compose config and Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Compose config (all recipes)
        env:
          OPENFDD_SITE_ID: local
          OPENFDD_EDGE_ID: fieldbus-1
          OPENFDD_MQTT_HOST: 127.0.0.1
          OPENFDD_JWT_SECRET: ci-compose-config-secret-not-for-prod
          OPENFDD_ADMIN_PASSWORD: ci-compose-admin-not-for-prod
        run: |
          for f in docker/compose.portal.yml docker/compose.central.yml docker/compose.csv.yml docker/compose.react.yml; do
            test -f "$f"
            docker compose -f "$f" config >/dev/null
            echo "OK config: $f"
          done
          OPENFDD_OT_ARCHIVE_RESTORE=1 ./archive/ot-edge/unqualified-cdaa4f15/recipes/restore-isolated.sh --replay >/tmp/ot-archive-replay.txt
          grep -q 'No containers were started' /tmp/ot-archive-replay.txt

      - name: Disposable browser compose resolves local images
        run: bash scripts/ci/real_stack_browser.sh --config-check

      - name: Stack script syntax
        run: |
          bash -n scripts/openfdd_stack_lib.sh
          bash -n scripts/openfdd_stack_pull.sh
          bash -n scripts/openfdd_stack_up.sh
          bash -n scripts/openfdd_caddy_smoke.sh
          bash -n scripts/test_openfdd_stack_image_tag.sh
          bash scripts/test_openfdd_stack_image_tag.sh
          test -f docker/compose.wattlab.react.yml
          test -f docker/compose.caddy.react.yml
          test -f docker/caddy/Caddyfile.react.http
          test -f docs/mcp-agents/companion-wattlab-energyplus.md
          test -f docs/mcp-agents/dual-site-mcp-it.md

  lifecycle-scripts:
    name: Stack script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n scripts/openfdd_stack_lib.sh
          bash -n scripts/openfdd_stack_pull.sh
          bash -n scripts/openfdd_stack_up.sh
          bash -n scripts/openfdd_caddy_smoke.sh
          bash -n scripts/openfdd_csv_import_sidecar.sh
          bash -n scripts/openfdd_csv_export_sidecar.sh
          bash -n scripts/test_openfdd_stack_image_tag.sh
          bash scripts/test_openfdd_stack_image_tag.sh
          test -f docker/compose.wattlab.react.yml
          test -f docs/mcp-agents/companion-wattlab-energyplus.md

  site-lifecycle:
    name: Site lifecycle Timescale fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      timescale:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: openfdd
          POSTGRES_PASSWORD: openfdd
          POSTGRES_DB: openfdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfdd -d openfdd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Sole, shared, repeat, and dataset purge
        env:
          OPENFDD_LIFECYCLE_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
          OPENFDD_LIFECYCLE_DATABASE_REQUIRED: "1"
        run: cargo test -p openfdd-central site_lifecycle_purges_owned_sites -- --test-threads=1
      - name: Elapsed-time cadence and gap contract
        env:
          OPENFDD_LIFECYCLE_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
          OPENFDD_LIFECYCLE_DATABASE_REQUIRED: "1"
        run: cargo test -p openfdd-central elapsed_time_cadence_and_gap_contract -- --test-threads=1

  ingest-tenant-scope:
    name: Ingest tenant scope Timescale fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      timescale:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: openfdd
          POSTGRES_PASSWORD: openfdd
          POSTGRES_DB: openfdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfdd -d openfdd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Idempotency, backfill identity, queue metrics, and ingest ledger contract
        env:
          OPENFDD_TEST_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
          OPENFDD_INGEST_SCOPE_DATABASE_REQUIRED: "1"
        run: |
          cargo test -p openfdd-central ingest_idempotency_backfill_and_metrics_are_tenant_scoped -- --test-threads=1
          cargo test -p openfdd-central ingest_jobs_and_gaps_contract -- --test-threads=1
          cargo test -p openfdd-central upgraded_portal_enqueues_due_windows_and_accepts_backfill -- --test-threads=1
          cargo test -p openfdd-central stale_worker_cannot_overwrite_canonical_history -- --test-threads=1

  synthetic-sql-parity:
    name: Synthetic pandas equals Timescale SQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      timescale:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: openfdd
          POSTGRES_PASSWORD: openfdd
          POSTGRES_DB: openfdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfdd -d openfdd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Pandas oracle and Timescale FC1 parity
        env:
          OPENFDD_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
        run: |
          python3 -m pip install --user 'psycopg[binary]' 'pandas>=2.0' 'numpy>=1.26' 'openpyxl>=3.1' 'pyyaml>=6'
          python3 scripts/timescale/test_synthetic_pandas_sql_parity.py
          python3 scripts/timescale/test_ui_p0_timescale.py
