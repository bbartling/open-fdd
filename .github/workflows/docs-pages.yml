# Build and deploy Open-FDD docs to GitHub Pages (Just the Docs / Jekyll).
# Pages source must be "GitHub Actions" (not legacy /docs branch Jekyll).

name: Docs (GitHub Pages)

on:
  push:
    branches: [master, main, "release/**"]
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "openfdd_agent_spec/**"
      - "scripts/check_agent_spec.py"
      - "tests/test_agent_spec.py"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "scripts/check_skills_sync.py"
      - "tests/test_skills_sync.py"
      - "VERSION"
      - "nf-app/package.json"
      - "nf-app/static/fdd-catalog.json"
      - "scripts/nf/gen_rule_docs.py"
      - "scripts/nf/gen_cookbook.py"
      - "scripts/nf/docs_units.py"
      - "open_fdd/data/**"
      - "scripts/check_pages.py"
      - "sql/fdd/**"
      - "nf-app/rules/**"
      - "open_fdd/rules/**"
      - "tests/parity/test_parity.py"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    branches: [master, main, "release/**"]
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "openfdd_agent_spec/**"
      - "scripts/check_agent_spec.py"
      - "tests/test_agent_spec.py"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "scripts/check_skills_sync.py"
      - "tests/test_skills_sync.py"
      - "VERSION"
      - "nf-app/package.json"
      - "nf-app/static/fdd-catalog.json"
      - "scripts/nf/gen_rule_docs.py"
      - "scripts/nf/gen_cookbook.py"
      - "scripts/nf/docs_units.py"
      - "open_fdd/data/**"
      - "scripts/check_pages.py"
      - "sql/fdd/**"
      - "nf-app/rules/**"
      - "open_fdd/rules/**"
      - "tests/parity/test_parity.py"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per workflow + event + ref/head_ref, so one PR cannot cancel another. cancel-in-progress is on except for
# master and tag pushes, which must not drop an in-flight production deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: docs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Lock Ruby dependencies
        run: bundle lock
        working-directory: docs

      - name: Check the generated Rules catalog is current
        run: python3 scripts/nf/gen_rule_docs.py --check

      - name: Check the generated Rule Cookbook is current (SQL, pandas, parity)
        run: |
          python3 -m pip install --quiet pandas numpy pyyaml pytest
          python3 scripts/nf/gen_cookbook.py --check
          python3 scripts/check_skills_sync.py
          python3 scripts/check_agent_spec.py
          python3 -m pytest -q tests/test_skills_sync.py tests/test_agent_spec.py

      - name: Jekyll build
        run: bundle exec jekyll build --trace --strict_front_matter
        working-directory: docs
        env:
          JEKYLL_ENV: production

      - name: Verify site output
        run: test -f _site/index.html && test -f _site/rules/index.html && test -f _site/rules/sql-cookbook.html && test -f _site/rules/pandas-cookbook.html && test -f _site/rules/borrowing-sql.html && test -f _site/rules/parity.html && test -f _site/modeling.html && test -f _site/editions.html && test -f _site/normal-framework.html && test -f _site/legacy.html
        working-directory: docs

      - name: Check docs guardrails (five sections, word budgets, internal exclusion, unit tables) and published-site links
        run: python3 scripts/check_pages.py docs/_site

      - name: Check source Markdown links
        run: python3 scripts/check_links.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: build
    # Release-branch pushes build and link-check the site but never publish it.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
