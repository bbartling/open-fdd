# SQL rule pack + DB bootstrap gate. Carved out of rust-ci.yml when central was
# archived (slice 8, ADR-014). Only the checks that survive: rule columns, unit
# contract, fdd_core/fdd_rules crate tests, and pandas == Timescale SQL parity.
name: SQL pack CI

on:
  push:
    paths:
      - "sql/**"
      - "crates/**"
      - "Cargo.toml"
      - "scripts/ci/check_rule_columns.py"
      - "scripts/ci/check_unit_contract.py"
      - "scripts/timescale/**"
      - "open_fdd/**"
      - ".github/workflows/sql-pack-ci.yml"
  pull_request:
    paths:
      - "sql/**"
      - "crates/**"
      - "Cargo.toml"
      - "scripts/ci/check_rule_columns.py"
      - "scripts/ci/check_unit_contract.py"
      - "scripts/timescale/**"
      - "open_fdd/**"
      - ".github/workflows/sql-pack-ci.yml"

permissions:
  contents: read

jobs:
  rules:
    name: Rule contracts + fdd_core / fdd_rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2

      - name: VERSION matches workspace Cargo.toml
        run: |
          bash -n scripts/check_version_sync.sh
          ./scripts/check_version_sync.sh

      - name: Rule column contract (T1405-3)
        run: |
          python3 scripts/ci/check_rule_columns.py --self-test
          python3 scripts/ci/check_rule_columns.py

      - name: fdd_core + fdd_rules crate tests (T1405-1, T1405-2)
        run: cargo test -p fdd_core -p fdd_rules

      - name: Unit contract (T1284-1)
        run: |
          python3 scripts/ci/check_unit_contract.py
          cargo test -p fdd_core units_contract::

  synthetic-sql-parity:
    name: Synthetic pandas equals Timescale SQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      timescale:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: openfdd
          POSTGRES_PASSWORD: openfdd
          POSTGRES_DB: openfdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfdd -d openfdd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Pandas oracle and Timescale FC1 parity
        env:
          OPENFDD_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
        run: |
          python3 -m pip install --user 'psycopg[binary]' 'pandas>=2.0' 'numpy>=1.26' 'openpyxl>=3.1' 'pyyaml>=6'
          python3 scripts/timescale/test_synthetic_pandas_sql_parity.py
          python3 scripts/timescale/test_ui_p0_timescale.py
