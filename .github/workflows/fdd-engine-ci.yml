name: FDD SQL Engine CI
# Wave-X: Timescale/SQL pack gates. DataFusion CLI/bench retired (C2).

on:
  push:
    branches: [master, main]
    paths:
      - "crates/**"
      - "sql/fdd/**"
      - "sql_rules/**"
      - "services/central/**"
      - "scripts/ci/forbid_datafusion_product.sh"
      - ".github/workflows/fdd-engine-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "sql/fdd/**"
      - "sql_rules/**"
      - "services/central/**"
      - "scripts/ci/forbid_datafusion_product.sh"
      - ".github/workflows/fdd-engine-ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  fdd-sql-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install PyYAML for registry validation
        run: python3 -m pip install --user PyYAML
      - name: Forbid product DataFusion / fdd_sql
        run: bash scripts/ci/forbid_datafusion_product.sh
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy (Timescale FDD crates)
        run: |
          cargo clippy -p fdd_core -p fdd_csv -p fdd_resources -p fdd_rules -p fdd_tsdb --all-targets -- -D warnings
          cargo clippy -p openfdd-central --all-targets -- -D warnings
      - name: cargo test (plot roles + registry)
        run: |
          cargo test -p fdd_rules
          cargo test -p fdd_tsdb -- --test-threads=1
          cargo test -p openfdd-central db_safety -- --test-threads=1
          cargo test -p openfdd-central plot_role_tests -- --nocapture
      - name: SQL/fdd registry = 77 warehouse rules
        run: |
          python3 - <<'PY'
          import yaml, pathlib, sys
          root = pathlib.Path("sql/fdd")
          reg = yaml.safe_load((root / "registry.yaml").read_text())
          rules = reg.get("rules", [])
          missing = []
          for rule in rules:
              for cand in (
                  root / "postgres" / "rules" / rule["sql_file"],
                  root / "warehouse" / "rules" / rule["sql_file"],
                  root / "rules" / rule["sql_file"],
                  root / rule["sql_file"],
              ):
                  if cand.is_file():
                      break
              else:
                  missing.append(rule["sql_file"])
          if missing:
              print("Missing SQL files:", missing)
              sys.exit(1)
          n = len(rules)
          if n != 77:
              print(f"Expected exactly 77 registry rules (warehouse handoff), got {n}")
              sys.exit(1)
          empty = [r["rule_id"] for r in rules if not (r.get("required_roles") or r.get("optional_roles"))]
          if empty:
              print("Rules with empty plot roles:", empty)
              sys.exit(1)
          print(f"OK: {n} rules with plot roles")
          PY
