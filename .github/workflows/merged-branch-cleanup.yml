name: Clean merged PR branches

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete stale same-repo merged PR branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;

            const closedPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              per_page: 100,
              sort: 'updated',
              direction: 'desc',
            });
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            // Safety rule for normal cleanup: only delete a branch if its current
            // SHA is exactly the head SHA of a merged PR from this repository. If
            // a branch name was reused after merge, its SHA differs and it stays.
            const mergedHeads = new Map();
            for (const pr of closedPulls) {
              if (!pr.merged_at) continue;
              if (pr.head?.repo?.full_name !== `${owner}/${repo}`) continue;
              if (!pr.head?.ref || !pr.head?.sha) continue;
              const shas = mergedHeads.get(pr.head.ref) ?? new Set();
              shas.add(pr.head.sha);
              mergedHeads.set(pr.head.ref, shas);
            }

            const openHeads = new Set(
              openPulls
                .filter((pr) => pr.head?.repo?.full_name === `${owner}/${repo}`)
                .map((pr) => pr.head.ref),
            );

            // One-time historian cleanup. These aliases were verified to contain
            // no unique work after #760 replaced the abandoned stacked H4 line.
            // Never delete one if somebody has opened a PR from it in the meantime.
            const supersededBranches = new Set([
              'feat/historian-compaction-ci',
              'feat/historian-compaction-next',
              'feat/historian-compaction-pr',
            ]);

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            for (const branch of branches) {
              if (branch.name === defaultBranch) continue;

              const mergedShas = mergedHeads.get(branch.name);
              const exactMergedHead = mergedShas?.has(branch.commit.sha) ?? false;
              const verifiedSuperseded =
                supersededBranches.has(branch.name) && !openHeads.has(branch.name);
              if (!exactMergedHead && !verifiedSuperseded) continue;

              core.info(`Deleting stale branch ${branch.name} @ ${branch.commit.sha}`);
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch.name}`,
              });
            }
