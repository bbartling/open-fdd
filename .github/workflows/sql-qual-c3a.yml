name: sql-qual-c3a

on:
  push:
    branches: [master, main]
    paths:
      - "scripts/qualification/c3a/**"
      - "tests/qualification/test_c3a_sql_qual_01_06.py"
      - ".github/workflows/sql-qual-c3a.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "scripts/qualification/c3a/**"
      - "tests/qualification/test_c3a_sql_qual_01_06.py"
      - ".github/workflows/sql-qual-c3a.yml"

concurrency:
  group: sql-qual-c3a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-qual-c3a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      timescale:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: openfdd
          POSTGRES_PASSWORD: openfdd
          POSTGRES_DB: openfdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfdd -d openfdd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPENFDD_DATABASE_URL: postgresql://openfdd:openfdd@localhost:5432/openfdd
      OPENFDD_P1_REQUIRE_EXTERNAL_IDENTITY_PINS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Pin external P1 candidate identity
        run: |
          rev="$(git rev-parse HEAD)"
          tree="$(python3 -c "from pathlib import Path; from scripts.stress.si_cutover.p1_candidate_identity import compute_repo_candidate_pins; print(compute_repo_candidate_pins(Path('.'))[1])")"
          echo "OPENFDD_P1_EXPECTED_CANDIDATE_REV=${rev}" >> "$GITHUB_ENV"
          echo "OPENFDD_P1_EXPECTED_OPEN_FDD_TREE_SHA256=${tree}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness deps
        run: |
          python -m pip install -U pip
          pip install 'psycopg[binary]>=3.1' pyyaml pytest
          pip install -e ".[oracle]"

      - name: SQL-QUAL C3a matrix (DB-backed)
        run: |
          python3 scripts/qualification/c3a/run_matrix.py --matrix-out sql_qual_c3a_matrix.json | tee /tmp/c3a_matrix.log
          grep -q "SQL-QUAL C3a DB hydrated=True" /tmp/c3a_matrix.log
          python3 -c "import json; assert json.load(open('sql_qual_c3a_matrix.json'))['db_hydrated'] is True"
          echo "SQL-QUAL C3a disposable Postgres checks executed (matrix log above)"

      - name: SQL-QUAL C3a unit tests
        run: python3 -B -m unittest tests.qualification.test_c3a_sql_qual_01_06 -v

      - name: Upload sql_qual_c3a_matrix.json
        uses: actions/upload-artifact@v4
        with:
          name: sql-qual-c3a-matrix
          path: sql_qual_c3a_matrix.json
