name: PR2 equipment-type patch

on:
  push:
    branches: [feat/equipment-type-contract]
    paths:
      - .github/workflows/pr2-agent-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/equipment-type-contract
          fetch-depth: 0
      - name: Apply scoped PR2 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:120]!r}")
              text2 = text.replace(old, new, count)
              p.write_text(text2)

          # Export the generic type registry from the edge crate.
          replace("edge/src/lib.rs", "pub mod csv_ingest;\n", "pub mod csv_ingest;\npub mod equipment_types;\n")

          # Package ingest: capture equipType/equipment_type, materialize it, and persist
