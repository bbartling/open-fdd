          ''')
          replace("services/central/src/analytics/historian.rs", '''        let Some(plant) = plant_group_for(eq) else {
                      continue;
                  };
          ''', '''        let Some(plant) = plant_group_for_typed(
                      eq,
                      stamped_types.get(eq).map(String::as_str),
                  ) else {
                      continue;
                  };
          ''')

          # Plant-health family matching uses the same type precedence.
          old_match = '''pub fn matches_family(family: PlantFamily, equipment_id: &str) -> bool {
              match family {
                  PlantFamily::Ahu => plant_group_for(equipment_id) == Some("air"),
                  PlantFamily::Chiller => {
                      plant_group_for(equipment_id) == Some("chiller") && !is_heat_pump_id(equipment_id)
                  }
                  PlantFamily::Boiler => plant_group_for(equipment_id) == Some("boiler"),
                  PlantFamily::HeatPump => is_heat_pump_id(equipment_id),
              }
          }
          '''
          new_match = '''pub fn matches_family_typed(
              family: PlantFamily,
              equipment_id: &str,
              stamped_type: Option<&str>,
          ) -> bool {
              let stamped_kind = stamped_type.and_then(open_fdd_edge_prototype::equipment_types::canonical_kind);
              match family {
                  PlantFamily::Ahu => super::historian::plant_group_for_typed(equipment_id, stamped_type) == Some("air"),
                  PlantFamily::Chiller => {
                      super::historian::plant_group_for_typed(equipment_id, stamped_type) == Some("chiller")
                          && stamped_kind != Some("heatpump")
                          && !is_heat_pump_id(equipment_id)
                  }
                  PlantFamily::Boiler => super::historian::plant_group_for_typed(equipment_id, stamped_type) == Some("boiler"),
                  PlantFamily::HeatPump => stamped_kind == Some("heatpump") || is_heat_pump_id(equipment_id),
              }
          }

          pub fn matches_family(family: PlantFamily, equipment_id: &str) -> bool {
              matches_family_typed(family, equipment_id, None)
          }
          '''
          replace("services/central/src/analytics/plant_health.rs", old_match, new_match)
          replace("services/central/src/analytics/plant_health.rs", '''    let (has_fdd, index) = fdd_index(bid);
              let mut seen = 0u32;
