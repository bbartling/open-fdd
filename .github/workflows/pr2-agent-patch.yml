          replace("edge/src/csv_ingest/package.rs", '''struct EquipmentPlan {
              equipment_id: String,
              dir: PathBuf,
              headers: Vec<String>,
              roles: BTreeMap<String, String>,
              map_source: String,
          }
          ''', '''struct EquipmentPlan {
              equipment_id: String,
              dir: PathBuf,
              headers: Vec<String>,
              roles: BTreeMap<String, String>,
              map_source: String,
              equipment_type: Option<String>,
          }
          ''')
          replace("edge/src/csv_ingest/package.rs", '''        let mut map_source = String::new();
                  let mut points: Option<BTreeMap<String, String>> = None;
          ''', '''        let mut map_source = String::new();
                  let mut points: Option<BTreeMap<String, String>> = None;
                  let mut equipment_type: Option<String> = None;
          ''')
          replace("edge/src/csv_ingest/package.rs", '''                    Ok(v) => {
                                      points = points_from_map_json(&v, &equip_id);
          ''', '''                    Ok(v) => {
                                      if equipment_type.is_none() {
                                          equipment_type = crate::equipment_types::stamped_type_from_map_json(&v, &equip_id);
                                      }
                                      points = points_from_map_json(&v, &equip_id);
          ''')
          replace("edge/src/csv_ingest/package.rs", '''        if points.is_none() {
                      if let Some(root) = &root_map {
