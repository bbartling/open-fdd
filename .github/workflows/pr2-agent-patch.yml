          # FDD inventory/results: stamped type is authoritative when recognized.
          replace("edge/src/fdd/registry_api.rs", '''fn infer_equipment_type(equipment_id: &str) -> &'static str {
              match infer_equipment_kind(equipment_id) {
                  "vav" => "VAV",
                  "ahu" => "AHU",
                  "chiller" | "boiler" | "cooling_tower" => "PLANT",
                  "heatpump" => "HEAT_PUMP",
                  "weather" => "WEATHER",
                  _ => "GENERAL",
              }
          }

          fn infer_equipment_kind(equipment_id: &str) -> &'static str {
              let id = equipment_id.to_ascii_uppercase();
              if id.contains("WEATHER") {
                  "weather"
              } else if id.contains("VAV") || id.contains("ZONE") {
                  "vav"
              } else if id.contains("AHU") || id.contains("RTU") || id.contains("MAU") {
                  "ahu"
              } else if id.contains("CHILL") {
                  "chiller"
              } else if id.contains("BOILER") {
                  "boiler"
              } else if id.contains("TOWER") {
                  "cooling_tower"
              } else if id.contains("HP") || id.contains("HEAT_PUMP") || id.contains("HEATPUMP") {
                  "heatpump"
              } else {
                  "unknown"
              }
          }
          ''', '''fn infer_equipment_type(equipment_id: &str) -> &'static str {
              crate::equipment_types::api_equipment_type_for(equipment_id, None)
          }

          fn infer_equipment_kind(equipment_id: &str) -> &'static str {
              crate::equipment_types::infer_kind_from_id(equipment_id)
          }
          ''')
          replace("edge/src/fdd/registry_api.rs", '''    ids.sort();
              ids.dedup();
              let equipment: Vec<Value> = ids
                  .iter()
                  .map(|id| {
                      json!({
                          "equipment_id": id,
                          "equipment_type": infer_equipment_type(id),
                      })
                  })
                  .collect();
          ''', '''    ids.sort();
              ids.dedup();
              let stamped_types = crate::equipment_types::load_type_map(&parquet_root(), building_id);
              let equipment: Vec<Value> = ids
                  .iter()
                  .map(|id| {
                      let stamped = stamped_types.get(id).map(String::as_str);
                      crate::equipment_types::type_report(id, stamped)
                  })
                  .collect();
          ''')
          replace("edge/src/fdd/registry_api.rs", '''pub fn results_response(building_id: Option<&str>) -> Value {
              let dir = results_dir(building_id);
              let reg = load_reg().ok();
          ''', '''pub fn results_response(building_id: Option<&str>) -> Value {
              let dir = results_dir(building_id);
              let stamped_types = crate::equipment_types::load_type_map(&parquet_root(), building_id);
              let reg = load_reg().ok();
          ''')
          replace("edge/src/fdd/registry_api.rs", '''                let kind = infer_equipment_kind(equipment_id);
          ''', '''                let stamped = stamped_types.get(equipment_id).map(String::as_str);
                          let kind = crate::equipment_types::kind_for(equipment_id, stamped);
          ''')
          replace("edge/src/fdd/registry_api.rs", '''                    "equipment_type": infer_equipment_type(equipment_id),
                      "status": status,
          ''', '''                    "equipment_type": crate::equipment_types::api_equipment_type_for(equipment_id, stamped),
                      "equipment_type_raw": stamped,
                      "equipment_type_source": if stamped.and_then(crate::equipment_types::canonical_kind).is_some() { "package" } else { "id" },
                      "status": status,
          ''')

          # Central runtime grouping: typed classification first, same id fallback second.
          old_group = '''/// Map equipment_id → Overview plant chart group (air / boiler / chiller).
          /// Zone terminals (VAV / ZONE) and unknown meters return `None`.
          pub fn plant_group_for(equipment_id: &str) -> Option<&'static str> {
              let eq = equipment_id.to_ascii_uppercase().replace('\\\\', "/");
              if is_zone_terminal_id(&eq) {
                  return None;
              }
              if eq.starts_with("AHU")
                  || eq.contains("/AHU")
                  || eq.contains("RTU")
                  || eq.contains("MAU")
                  || eq.contains("DOAS")
              {
                  return Some("air");
              }
              if eq.contains("TOWER")
                  || eq.starts_with("CT_")
                  || eq.contains("/CT")
                  || (eq.starts_with("CT") && eq.chars().nth(2).is_some_and(|c| c.is_ascii_digit()))
                  || eq.contains("CHILLER")
                  || eq.contains("CHLR")
                  || is_short_chiller_id(&eq)
                  || eq.starts_with("CHW")
                  || eq.contains("CWP")
                  || eq.contains("_DX")
                  || eq.starts_with("DX")
                  || eq.starts_with("HP_")
                  || (eq.contains("PUMP") && (eq.contains("CHW") || eq.contains("CW")))
              {
                  return Some("chiller");
              }
              if eq.contains("BOILER")
                  || eq.contains("HWP")
                  || (eq.contains("PUMP") && eq.contains("HW") && !eq.contains("CHW"))
                  || eq.contains("BOILERS")
              {
                  return Some("boiler");
              }
              // Do not catch bare FAN/SUPPLY — too broad (exhaust/return/etc.).
              None
          }
          '''
          new_group = '''/// Map equipment_id → Overview plant chart group (air / boiler / chiller).
          /// Prefer a package `equipType` / `equipment_type` stamp when recognized;
          /// fall back to generic id heuristics. Zone terminals and unknown meters are omitted.
          pub fn plant_group_for_typed(
              equipment_id: &str,
              stamped_type: Option<&str>,
          ) -> Option<&'static str> {
              if let Some(kind) = stamped_type.and_then(open_fdd_edge_prototype::equipment_types::canonical_kind) {
                  return match kind {
                      "ahu" => Some("air"),
                      "chiller" | "cooling_tower" | "heatpump" => Some("chiller"),
                      "boiler" => Some("boiler"),
                      "vav" | "weather" => None,
                      _ => None,
                  };
              }
              let eq = equipment_id.to_ascii_uppercase().replace('\\\\', "/");
              if is_zone_terminal_id(&eq) {
                  return None;
              }
              if eq.starts_with("AHU")
                  || eq.contains("/AHU")
                  || eq.contains("RTU")
                  || eq.contains("MAU")
                  || eq.contains("DOAS")
              {
                  return Some("air");
              }
              if eq.contains("TOWER")
                  || eq.starts_with("CT_")
                  || eq.contains("/CT")
                  || (eq.starts_with("CT") && eq.chars().nth(2).is_some_and(|c| c.is_ascii_digit()))
                  || eq.contains("CHILLER")
                  || eq.contains("CHLR")
                  || is_short_chiller_id(&eq)
                  || eq.starts_with("CHW")
                  || eq.contains("CWP")
                  || eq.contains("_DX")
                  || eq.starts_with("DX")
                  || eq.starts_with("HP_")
                  || (eq.contains("PUMP") && (eq.contains("CHW") || eq.contains("CW")))
              {
                  return Some("chiller");
              }
              if eq.contains("BOILER")
                  || eq.contains("HWP")
                  || (eq.contains("PUMP") && eq.contains("HW") && !eq.contains("CHW"))
                  || eq.contains("BOILERS")
              {
                  return Some("boiler");
              }
              None
          }

          pub fn plant_group_for(equipment_id: &str) -> Option<&'static str> {
              plant_group_for_typed(equipment_id, None)
          }
          '''
          replace("services/central/src/analytics/historian.rs", old_group, new_group)
          replace("services/central/src/analytics/historian.rs", '''    let max_gap = max_gap_seconds.max(0.0);
              let eq_filter = equipment_filter_sql(equipment_filter);

              if cols.contains("equipment_id") {
          ''', '''    let max_gap = max_gap_seconds.max(0.0);
              let eq_filter = equipment_filter_sql(equipment_filter);
              let stamped_types = open_fdd_edge_prototype::equipment_types::load_type_map(
                  &parquet_root(),
                  building_id,
              );

              if cols.contains("equipment_id") {
          ''')
          replace("services/central/src/analytics/historian.rs", '''                            "plant_group": plant_group_for(
                                          row.get("equipment_id").and_then(|v| v.as_str()).unwrap_or("")
                                      ),
          ''', '''                            "plant_group": plant_group_for_typed(
