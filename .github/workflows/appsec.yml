name: AppSec

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-scan:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: trivy fs
        run: trivy fs --exit-code 1 --severity HIGH,CRITICAL .

  security-harness:
    name: Qualification unit tests (SQL, semantic, NF tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated qualification tooling dependencies
        run: |
          python3 -m pip install --quiet -r scripts/qualification/requirements.txt
          python3 -m pip install --quiet -e ".[oracle]"
      - name: Qualification unittests
        run: python3 -B -m unittest discover -s tests/qualification -v
      - name: NF portal operator tools (offline pytest)
        run: python3 -m pip install --quiet pytest && python3 -m pytest -q scripts/nf_tools/tests
      - name: Haystack known-answer and broken-control suite (offline)
        run: |
          python3 -B scripts/qualification/semantic/qualify.py suite \
            --candidate "$GITHUB_SHA" --out "$RUNNER_TEMP/semantic-qualification.json"
      - name: Keep semantic harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-harness-evidence
          path: ${{ runner.temp }}/semantic-qualification.json
          if-no-files-found: error
      - name: Protocol connector evaluator selftest
        run: |
          python3 scripts/qualification/protocol_connector_qualification.py --selftest
          python3 scripts/qualification/protocol_connector_qualification.py \
            --stage synthetic --require-stage synthetic \
            --report-dir "$RUNNER_TEMP/protocol-connector-qualification"
