name: AppSec

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-scan:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: trivy fs
        run: trivy fs --exit-code 1 --severity HIGH,CRITICAL .

  dashboard-audit:
    name: React sole product UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard product UI path
        run: |
          test -f frontend/web/package.json
          test -f frontend/web/Dockerfile
          test -f docker/compose.react.yml
          ! test -d services/ui
          ! grep -qE 'openfdd-ui|services/ui|:8501' docker/compose.portal.yml docker/compose.central.yml docker/compose.csv.yml
          ! test -f workspace/dashboard/package.json

  dockerfile-lint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint central
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/central/Dockerfile
          failure-threshold: error
          ignore: DL3008
      - name: Hadolint web (React)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/web/Dockerfile
          failure-threshold: error
          ignore: DL3008
      - name: Hadolint MCP
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.mcp
          failure-threshold: error
          ignore: DL3008

  security-harness:
    name: Security + qualification unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated qualification tooling dependencies
        run: |
          python3 -m pip install --quiet -r scripts/qualification/requirements.txt
          python3 -m pip install --quiet -e ".[oracle]"
      - name: Offline security unittests (E01–E08 + inventory)
        run: python3 -B -m unittest discover -s tests/security -v
      - name: Qualification unittests
        run: python3 -B -m unittest discover -s tests/qualification -v
      - name: Haystack known-answer and broken-control suite (offline)
        run: |
          python3 -B scripts/qualification/semantic/qualify.py suite \
            --candidate "$GITHUB_SHA" --out "$RUNNER_TEMP/semantic-qualification.json"
      - name: Keep semantic harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-harness-evidence
          path: ${{ runner.temp }}/semantic-qualification.json
          if-no-files-found: error
      - name: Portal qualification recipe lint (no containers started)
        env:
          OPENFDD_IMAGE_TAG: sha-0000000
          OPENFDD_DATABASE_URL: postgresql://openfdd@timescale:5432/openfdd
          OPENFDD_TIMESCALE_PASSWORD: ci-render-only
          PORTAL_QUAL_WEB_PORT: "18080"
        run: |
          for f in scripts/qualification/*.sh scripts/qualification/lib/*.sh; do bash -n "$f"; done
          (cd scripts/qualification && shellcheck -x run_portal_qualification.sh restore_to_empty.sh \
            run_isolated_zap_af.sh run_wave_c_isolated.sh lib/portal_stack.sh)
          docker compose -p openfdd-qual-ci-render --profile nf \
            -f docker/compose.portal.yml -f docker/compose.timescale.yml \
            -f docker/compose.portal-qual.yml config --quiet
          python3 -B scripts/security/deployment_profile_qualification.py --list-profiles
      - name: Protocol connector evaluator selftest
        run: |
          python3 scripts/qualification/protocol_connector_qualification.py --selftest
          python3 scripts/qualification/protocol_connector_qualification.py \
            --stage synthetic --require-stage synthetic \
            --report-dir "$RUNNER_TEMP/protocol-connector-qualification"
      - name: ZAP baseline verdict selftest
        run: python3 scripts/qualification/zap_baseline_verdict.py --selftest
      - name: Nessus importer selftest
        run: python3 scripts/security/nessus/import_nessus_report.py --selftest
      - name: Standalone HTTPS bootstrap selftest
        run: python3 scripts/security/peer_probe_https.py --selftest
