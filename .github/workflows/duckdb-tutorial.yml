name: DuckDB borrowing-SQL tutorial

on:
  pull_request:
    paths:
      - "tutorials/duckdb_sql_parity/**"
      - "open_fdd/parity/**"
      - "nf-app/rules/pack-postgres.json"
      - ".github/workflows/duckdb-tutorial.yml"
  push:
    branches: [master]
    paths:
      - "tutorials/duckdb_sql_parity/**"
      - "open_fdd/parity/**"
      - "nf-app/rules/pack-postgres.json"
      - ".github/workflows/duckdb-tutorial.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tutorial dependencies
        run: python -m pip install -e ".[oracle]" duckdb "rdflib>=7.0" matplotlib
      - name: Verify in-memory DataFrame exploration and plots
        env:
          MPLBACKEND: Agg
        run: python tutorials/duckdb_sql_parity/explore_data.py
      - name: Verify SQL versus pandas equivalence
        run: python tutorials/duckdb_sql_parity/compare_rules.py
      - name: Verify SPARQL metadata to DuckDB samples
        run: python tutorials/duckdb_sql_parity/sparql_samples.py
