name: Optional published pandas + current SQL oracle checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
  # PRs that edit this harness run the same check as the weekly schedule.
  pull_request:
    paths:
      - ".github/workflows/pypi-sql-parity.yml"
      - "scripts/sql_pandas_oracle_check.py"

permissions:
  contents: read

concurrency:
  # Per ref so a PR run does not cancel the weekly master schedule, or another branch.
  group: published-pandas-current-sql-oracle-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-pandas-oracle:
    name: latest PyPI pandas oracle seeds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create isolated PyPI environment
        run: |
          # The oracle guard requires open_fdd.rules to resolve from
          # site-packages outside this checkout. A venv created in the
          # working tree puts that install under $GITHUB_WORKSPACE, so the
          # guard rejects a real PyPI wheel as local source.
          if [[ -z "${RUNNER_TEMP}" ]]; then
            echo "RUNNER_TEMP is required so the PyPI venv is created outside the checkout" >&2
            exit 1
          fi
          venv="${RUNNER_TEMP}/venv-pypi"
          workspace="$(realpath -m "${GITHUB_WORKSPACE}")"
          venv_real="$(realpath -m "${venv}")"
          case "${venv_real}" in
            "${workspace}" | "${workspace}"/*)
              echo "PyPI venv must be created outside the checkout (got ${venv_real})" >&2
              exit 1
              ;;
          esac
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install --upgrade pip
          "${venv}/bin/python" -m pip install "open-fdd[oracle]" pyyaml
          echo "PYPI_VENV=${venv}" >> "${GITHUB_ENV}"

      - name: Record published oracle version
        run: |
          version="$("${PYPI_VENV}/bin/python" -c 'import importlib.metadata as m; print(m.version("open-fdd"))')"
          echo "Installed PyPI open-fdd: ${version}"
          {
            echo "## Published pandas oracle"
            echo
            echo "- PyPI package: \`open-fdd ${version}\`"
            echo "- Source: isolated virtualenv site-packages outside the checkout (\`${PYPI_VENV}\`)"
            echo "- Contract: committed oracle seed expectations"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run committed oracle seeds against PyPI package
        run: |
          "${PYPI_VENV}/bin/python" scripts/sql_pandas_oracle_check.py --require-external-oracle

  current-sql-registry:
    name: current SQL/fdd registry (Timescale pack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Forbid product DataFusion
        run: bash scripts/ci/forbid_datafusion_product.sh

      - name: Registry + plot-role unit tests
        run: |
          cargo test -p fdd_rules
          cargo test -p openfdd-central plot_role_tests

      - name: Record checkout revision
        run: |
          {
            echo "## Current SQL/Timescale pack"
            echo
            echo "- Git revision: \`${GITHUB_SHA}\`"
            echo "- Test: \`cargo test -p fdd_rules\` + plot_role_tests"
            echo "- Contract: 77-rule warehouse registry (DataFusion retired)"
          } >> "$GITHUB_STEP_SUMMARY"

  contract-note:
    name: independent-check contract
    needs:
      - published-pandas-oracle
      - current-sql-registry
    runs-on: ubuntu-latest
    steps:
      - name: Record interpretation
        run: |
          {
            echo "## Independent oracle-check interpretation"
            echo
            echo "Published pandas oracle and the Timescale SQL/fdd registry pack each passed their own contracts."
            echo "Wave-X: product DataFusion is retired; full 77-case API parity is a separate Soft-OPEN gate (≠ FQ)."
          } >> "$GITHUB_STEP_SUMMARY"
