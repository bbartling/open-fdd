# pandas == SQL parity, PR tier: the open_fdd pandas oracle must agree with the SQL FDD pack (sql/fdd) across
# PGlite, SQLite, DuckDB and standalone PostgreSQL on synthetic SI data, and the three-way check (SI pandas == SQL ==
# the SPARQL data client running the same pandas rule functions) must agree on the small 2x3 datasets (2 equipment,
# 3 days, basic and edge profiles). Both jobs are required checks on master. The larger 4x3 / 8x7 tiers run nightly
# and before each release in parity-stress.yml. Tiers: docs/rules/parity-harness.md.
name: pandas == SQL parity

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: pandas oracle vs SQL pack
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install oracle (pandas), DuckDB, and nf-app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[oracle,test,rdf,duckdb]"
          cd nf-app && npm ci

      # pandas oracle vs the SQL pack (PGlite + SQLite + DuckDB), all in SI. Known divergences are pinned
      # in open_fdd/data/parity_known_differences.json; the test fails if that set changes.
      - name: Python tests (pandas == SQL parity, engine matrix, NF agent tools, deploy tool)
        run: |
          set -o pipefail
          python -m pytest tests -q --ignore=tests/parity/test_sparql_parity.py --ignore=tests/parity/test_sparql_motor_gate.py -k "not test_postgres_4x3_basic_and_edge_parity and not test_timescale_through_the_core_tables and not test_timescale_native_unit_ingestion"

      # The 4x3 and 8x7 stress tiers moved to the nightly / pre-release workflow (#1617): PR CI keeps the unit-level
      # parity tests here and the 2x3 three-way stress in the SPARQL job.

  sparql:
    # Third leg (#1618): the SPARQL data client (open_fdd.nf.sparql_data) through the shipped sparql-data / rdf hooks
    # over the same synthetic datasets, the oracle's own pandas rule functions on its frames. pandas == SQL ==
    # SPARQL-client; a skip or any disagreeing path fails the lane. Required check (PR tier: 2x3 basic and edge).
    name: pandas == SQL == SPARQL-client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install oracle (pandas), rdflib, DuckDB and nf-app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[oracle,test,rdf,duckdb]"
          cd nf-app && npm ci

      - name: SPARQL client, hook transport and motor-status gate tests (fail on skip)
        run: |
          set -o pipefail
          python -m pytest tests/test_nf_sparql_data.py tests/parity/test_sparql_parity.py tests/parity/test_sparql_motor_gate.py -q -rs 2>&1 | tee "$RUNNER_TEMP/sparql.log"
          if grep -Eq "SKIPPED|skipped" "$RUNNER_TEMP/sparql.log"; then echo "SPARQL parity tests skipped: failing the lane"; exit 1; fi

      - name: Three-way SI stress, PR tier (2x3 basic, 2x3 edge; PGlite, SQLite, DuckDB)
        run: |
          python tests/parity/stress.py --engines pglite,sqlite,duckdb --equips 2 --days 3 --profile basic --sparql --out "$RUNNER_TEMP/3way-2x3-basic.json"
          python tests/parity/stress.py --engines pglite,sqlite,duckdb --equips 2 --days 3 --profile edge --sparql --out "$RUNNER_TEMP/3way-2x3-edge.json"

  postgres:
    name: standalone PostgreSQL parity (no Timescale)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      pg:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: example
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install oracle (pandas), DuckDB, Postgres driver, and nf-app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[oracle,test,rdf,duckdb,postgres]"
          cd nf-app && npm ci

      - name: Standalone PostgreSQL parity tests & stress (fail on skip)
        env:
          OPENFDD_PG_TEST_DISPOSABLE: "1"
          POSTGRES_TEST_URL: postgres://postgres:example@localhost:5432/postgres
        run: |
          set -o pipefail
          python -m pytest tests/parity/test_engine_matrix.py tests/test_sql_anomaly_zscore.py tests/test_sql_motor_runtime.py tests/test_sql_mech_cooling.py tests/test_sql_economizer.py tests/test_sql_bas_web.py tests/test_sql_point_stats.py -q -rA 2>&1 | tee "$RUNNER_TEMP/pg-parity.log"
          if grep -Eq "SKIPPED|skipped|deselected" "$RUNNER_TEMP/pg-parity.log"; then echo "Postgres parity tests skipped: failing the lane"; exit 1; fi
          # the PostgreSQL test must have actually run and passed against the service container, not just "not skipped"
          grep -Eq "^PASSED .*test_postgres_4x3_basic_and_edge_parity" "$RUNNER_TEMP/pg-parity.log" || { echo "standalone PostgreSQL parity did not run"; exit 1; }
          # the SQL z-score (#1649) must have matched pandas on PostgreSQL too
          grep -Eq "^PASSED .*test_postgres_zscore_matches_pandas" "$RUNNER_TEMP/pg-parity.log" || { echo "PostgreSQL z-score parity did not run"; exit 1; }
          # and the SQL weekly motor run hours (#1649)
          grep -Eq "^PASSED .*test_postgres_matches_sqlite" "$RUNNER_TEMP/pg-parity.log" || { echo "PostgreSQL motor runtime parity did not run"; exit 1; }
          grep -Eq "^PASSED .*test_postgres_mech_bins_match_pandas" "$RUNNER_TEMP/pg-parity.log" || { echo "PostgreSQL mechanical-cooling bins parity did not run"; exit 1; }
          grep -Eq "^PASSED .*test_postgres_economizer_matches_pandas" "$RUNNER_TEMP/pg-parity.log" || { echo "PostgreSQL economizer parity did not run"; exit 1; }
          grep -Eq "^PASSED .*test_postgres_bas_web_matches_pandas" "$RUNNER_TEMP/pg-parity.log" || { echo "PostgreSQL BAS-vs-web parity did not run"; exit 1; }
          python tests/parity/stress.py --engines pglite,postgres,duckdb --equips 2 --days 3 --profile basic
          python tests/parity/stress.py --engines pglite,postgres,duckdb --equips 2 --days 3 --profile edge
