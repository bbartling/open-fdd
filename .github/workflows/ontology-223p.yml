# 223P alignment: vendored closure, OntoEnv offline, Shifty. No ontology download.
# A Violation fails the job and the report is uploaded.

name: 223P alignment

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  shacl:
    name: OntoEnv closure and Shifty
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pin rdflib, pyoxigraph, OntoEnv, Shifty and pySHACL
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "rdflib==7.6.0" \
            "pyoxigraph==0.5.13" \
            "ontoenv==0.6.4" \
            "pyshifty==0.6.0" \
            "pyshacl==0.40.2" \
            pytest

      - name: Role file matches the generator
        run: python3 scripts/nf/gen_roles_223p.py --check

      - name: Closure, role file, import fixture and export shapes
        run: |
          set -o pipefail
          python -m pytest tests/test_223p_closure.py tests/test_sparql_engines.py -q -rs 2>&1 | tee "$RUNNER_TEMP/align.log"
          if grep -Eq "SKIPPED|skipped" "$RUNNER_TEMP/align.log"; then echo "alignment tests skipped"; exit 1; fi
          python -m open_fdd.ontology_audit.align --report "$RUNNER_TEMP/shacl-report" --cross-check

      - name: Upload SHACL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 223p-shacl-report
          path: ${{ runner.temp }}/shacl-report
