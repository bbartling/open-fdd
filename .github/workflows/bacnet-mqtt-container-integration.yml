name: Optional BACnet to MQTT container integration

# 4.0 portal publish ships openfdd-central and openfdd-web only.
# openfdd-fieldbus is archived and is not published. openfdd-mqtt is published
# only by an explicit archived-OT dispatch, and that dispatch still does not
# publish fieldbus. A normal master publish therefore has no
# ghcr.io/bbartling/openfdd-fieldbus:sha-<head> (and no matching mqtt tag).
# Run 39362164673 failed by pulling sha-fe7e06b.
#
# This workflow does not boot archive/ot-edge/unqualified-cdaa4f15/evidence/oci-pin.json.
# That pin is unqualified, it is not this snapshot's source commit, and
# restore-isolated.sh --boot exits 2. Pointing archived fieldbus at a 4.0
# Timescale volume is not proven. The isolated lane stays
# restore-isolated.sh --replay plus scripts/gates/protocol_connector_split.sh.
#
# Automatic runs (portal publish, pull request, the old Monday schedule) succeed
# without pulling images when central+mqtt+fieldbus are not all published at the
# candidate sha. workflow_dispatch still runs the smoke only when the operator
# passes a sha-<7> that still has all three manifests.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Historical GHCR tag that still has central, mqtt, and fieldbus (sha-xxxxxxx)
        required: true
        type: string
  workflow_run:
    workflows:
      - Publish Open-FDD stack to GHCR
    types:
      - completed
  pull_request:
    paths:
      - .github/workflows/bacnet-mqtt-container-integration.yml
      - docker/compose.bacnet-mqtt-ci.yml
      - scripts/integration/bacnet_mqtt_container_smoke.sh
      - tests/integration/bacpypes3/**

permissions:
  contents: read
  packages: read

jobs:
  bacnet-mqtt-e2e:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out integration harness
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || 'master' }}

      - name: Resolve immutable product image tag
        id: image
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.image_tag }}
          PUBLISH_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          manifest_ok() {
            docker manifest inspect "$1" >/dev/null 2>&1
          }
          ot_trio_published() {
            local tag="$1" image
            for image in openfdd-central openfdd-mqtt openfdd-fieldbus; do
              if ! manifest_ok "ghcr.io/bbartling/${image}:${tag}"; then
                echo "missing ghcr.io/bbartling/${image}:${tag}" >&2
                return 1
              fi
            done
          }
          skip=0
          tag=""
          reason=""
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              tag="$DISPATCH_TAG"
              if [[ ! "$tag" =~ ^sha-[0-9a-f]{7}$ ]]; then
                echo "image tag must match sha-<7 lowercase hex>, got: ${tag:-empty}" >&2
                exit 1
              fi
              if ! ot_trio_published "$tag"; then
                echo "refusing smoke: ${tag} is not published for central, mqtt, and fieldbus" >&2
                echo "4.0 does not publish openfdd-fieldbus. This job does not use the OT archive OCI pin." >&2
                exit 1
              fi
              ;;
            workflow_run)
              [[ "$PUBLISH_SHA" =~ ^[0-9a-f]{40}$ ]]
              tag="sha-${PUBLISH_SHA:0:7}"
              if ! ot_trio_published "$tag"; then
                skip=1
                tag=""
                reason="4.0 portal publish does not include openfdd-fieldbus (or a matching openfdd-mqtt tag) at sha-${PUBLISH_SHA:0:7}. BACnet container integration is not a product gate."
              fi
              ;;
            pull_request)
              [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              tag="sha-${PR_BASE_SHA:0:7}"
              if ! ot_trio_published "$tag"; then
                skip=1
                tag=""
                reason="Base ${tag} has no published central+mqtt+fieldbus set. 4.0 does not publish openfdd-fieldbus. Skipping the container smoke."
              fi
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<EOF"
            printf '%s\n' "$reason"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ "$skip" == "0" ]]; then
            echo "Testing Open-FDD images: $tag"
          else
            echo "$reason"
          fi

      - name: Record 4.0 skip
        if: steps.image.outputs.skip == '1'
        run: |
          {
            echo "## BACnet → MQTTS container integration"
            echo
            echo "${{ steps.image.outputs.reason }}"
            echo
            echo "- OT archive lane stays \`archive/ot-edge/unqualified-cdaa4f15/recipes/restore-isolated.sh --replay\` (no containers) and \`scripts/gates/protocol_connector_split.sh\`."
            echo "- This job does not pull \`evidence/oci-pin.json\`. \`--boot\` stays refused."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run BACpypes3 BACnet to Open-FDD MQTTS integration
        if: steps.image.outputs.skip != '1'
        env:
          OPENFDD_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          chmod +x scripts/integration/bacnet_mqtt_container_smoke.sh
          ./scripts/integration/bacnet_mqtt_container_smoke.sh

      - name: Record qualification summary
        if: steps.image.outputs.skip != '1'
        run: |
          {
            echo "## BACnet → MQTTS container integration"
            echo
            echo "- Open-FDD image tag: \`${{ steps.image.outputs.tag }}\`"
            echo "- BACnet simulator: BACpypes3 0.0.106 mini-device"
            echo "- Path: BACnet/IP read/poll → openfdd-fieldbus → mTLS MQTT → openfdd-central parsed ingest + Timescale historian"
            echo "- Historian: Timescale via OPENFDD_DATABASE_URL (never Parquet; STORAGE-LOCK)"
            echo "- Product images are pulled from GHCR; only the lightweight Python simulator is built in this job."
          } >> "$GITHUB_STEP_SUMMARY"
