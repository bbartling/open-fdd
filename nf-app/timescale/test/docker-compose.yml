# Throwaway TimescaleDB for the Open-FDD timescale tests (example password, local port 55432 only).
#   docker compose -f nf-app/timescale/test/docker-compose.yml up -d
#   OPENFDD_TS_TEST_DISPOSABLE=1 PGURL=postgres://postgres:example@localhost:55432/postgres node --test nf-app/timescale/test/timescale.test.mjs
#   docker compose -f nf-app/timescale/test/docker-compose.yml down -v     # stop and delete the data
name: openfdd-timescale-test
services:
  db:
    image: timescale/timescaledb:2.31.0-pg17
    container_name: openfdd-timescale-test
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
