# Caddy edge for portal / csv (central static UI at /app/, same-origin /api).
#
#   OPENFDD_CADDY=1 ./scripts/openfdd_stack_up.sh portal --caddy
#   OPENFDD_CADDY_TLS=0  # plain HTTP on :80 (labs only)

services:
  caddy:
    image: ${OPENFDD_CADDY_IMAGE:-caddy:2.8-alpine}
    restart: unless-stopped
    ports:
      - "${OPENFDD_CADDY_HTTP_BIND:-0.0.0.0}:80:80"
      - "${OPENFDD_CADDY_HTTPS_BIND:-0.0.0.0}:443:443"
    volumes:
      - ${OPENFDD_CADDYFILE:-./caddy/Caddyfile.central.https}:/etc/caddy/Caddyfile:ro
    environment:
      OPENFDD_PUBLIC_HOST: ${OPENFDD_PUBLIC_HOST:-localhost}
      OPENFDD_CADDY_UPSTREAM: ${OPENFDD_CADDY_UPSTREAM:-central:8080}
    depends_on:
      - central
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
