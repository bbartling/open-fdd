# Open-FDD CSV-only recipe: central + React web (no MQTT, no fieldbus).
# Use when starting jobs from bulk CSV upload without live OT drivers.

name: openfdd-csv

services:
  central:
    image: ${OPENFDD_CENTRAL_IMAGE:-ghcr.io/bbartling/openfdd-central:nightly}
    build:
      context: ..
      dockerfile: services/central/Dockerfile
    environment:
      OPENFDD_MQTT_ENABLED: "0"
      OPENFDD_WORKSPACE: /workspace
      OPENFDD_PARQUET_ROOT: /workspace/.cache/parquet
      OPENFDD_JWT_SECRET: ${OPENFDD_JWT_SECRET:-}
      OPENFDD_ADMIN_PASSWORD: ${OPENFDD_ADMIN_PASSWORD:-}
      OPENFDD_REACT_UI: "1"
      OPENFDD_UI_GENERATION_DEFAULT: react
    ports:
      - "${OPENFDD_CENTRAL_BIND:-0.0.0.0}:8080:8080"
    volumes:
      - ../workspace:/workspace
    restart: unless-stopped

  web:
    image: ${OPENFDD_WEB_IMAGE:-ghcr.io/bbartling/openfdd-web:nightly}
    build:
      context: ../frontend/web
      dockerfile: Dockerfile
      args:
        OPENFDD_GIT_SHA: ${OPENFDD_GIT_SHA:-unknown}
        OPENFDD_WEB_VERSION: ${OPENFDD_WEB_VERSION:-0.1.0}
    ports:
      # nginx-unprivileged listens on 8080 inside the image.
      - "${OPENFDD_WEB_BIND:-0.0.0.0}:3000:8080"
    depends_on:
      - central
    restart: unless-stopped
