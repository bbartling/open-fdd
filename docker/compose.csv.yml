# Open-FDD CSV-only recipe: central static UI at /app/ + Timescale (no MQTT, no fieldbus).
# Bulk CSV upload labs without live OT drivers or a separate openfdd-web container.

name: openfdd-csv

services:
  central:
    image: ${OPENFDD_CENTRAL_IMAGE:-ghcr.io/bbartling/openfdd-central:nightly}
    build:
      context: ..
      dockerfile: services/central/Dockerfile
    environment:
      OPENFDD_WORKSPACE: /workspace
      OPENFDD_STORAGE_URL: file:///workspace/openfdd
      OPENFDD_JWT_SECRET: ${OPENFDD_JWT_SECRET:-}
      OPENFDD_ADMIN_PASSWORD: ${OPENFDD_ADMIN_PASSWORD:-}
      OPENFDD_AGENT_PASSWORD: ${OPENFDD_AGENT_PASSWORD:-}
      OPENFDD_ALLOW_OPEN_BIND: ${OPENFDD_ALLOW_OPEN_BIND:-}
      OPENFDD_STATIC_PRODUCT_UI: ${OPENFDD_STATIC_PRODUCT_UI:-1}
      OPENFDD_PROVIDER_SITES: ${OPENFDD_PROVIDER_SITES:-}
      OPENFDD_PROVIDER_POLL: ${OPENFDD_PROVIDER_POLL:-}
    ports:
      - "${OPENFDD_CENTRAL_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ../workspace:/workspace
    restart: unless-stopped
