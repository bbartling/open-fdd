# Open-FDD React SPA + central.
#
# Topology: central (+ optional mcp) + web (nginx SPA).
# Ingest is the Normal Framework portal and CSV. The MQTT broker is archived.
# Product path is Rust/React only — no Python in request runtime.

name: openfdd-react

x-openfdd-logging: &openfdd-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  central:
    image: ${OPENFDD_CENTRAL_IMAGE:-ghcr.io/bbartling/openfdd-central:nightly}
    build:
      context: ..
      dockerfile: services/central/Dockerfile
    environment:
      OPENFDD_SITE_ID: ${OPENFDD_SITE_ID:-local}
      OPENFDD_WORKSPACE: /workspace
      OPENFDD_STORAGE_URL: file:///workspace/openfdd
      # Historian/query tuning is explicitly forwarded from the host .env.
      OPENFDD_QUERY_MEMORY_MB: ${OPENFDD_QUERY_MEMORY_MB:-512}
      # Product recipe: require a deployment-unique secret (no public default).
      # Compose config fails loudly if unset — set in host .env / CI.
      OPENFDD_JWT_SECRET: ${OPENFDD_JWT_SECRET:?Set a unique OPENFDD_JWT_SECRET}
      OPENFDD_ADMIN_PASSWORD: ${OPENFDD_ADMIN_PASSWORD:-}
      OPENFDD_LOCAL_INGEST_TOKEN: ${OPENFDD_LOCAL_INGEST_TOKEN:-}
      OPENFDD_REACT_UI: "1"
      # P2-M4: React is the production default UI generation.
      OPENFDD_UI_GENERATION_DEFAULT: react
      # Structured JSON logs for Railway / AWS / pen-test scrapers (override with text locally).
      OPENFDD_LOG_FORMAT: ${OPENFDD_LOG_FORMAT:-json}
    ports:
      # Loopback by default; set OPENFDD_CENTRAL_BIND=0.0.0.0 only for intentional LAN/VPN.
      - "${OPENFDD_CENTRAL_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ../workspace:/workspace
    logging: *openfdd-logging
    restart: unless-stopped

  web:
    image: ${OPENFDD_WEB_IMAGE:-ghcr.io/bbartling/openfdd-web:nightly}
    build:
      context: ../frontend/web
      dockerfile: Dockerfile
      args:
        OPENFDD_GIT_SHA: ${OPENFDD_GIT_SHA:-unknown}
        OPENFDD_WEB_VERSION: ${OPENFDD_WEB_VERSION:-0.1.0}
    ports:
      # nginx-unprivileged listens on 8080 inside the image (P1-M1-A).
      - "${OPENFDD_WEB_BIND:-0.0.0.0}:3000:8080"
    depends_on:
      - central
    logging: *openfdd-logging
    restart: unless-stopped

  mcp:
    profiles: ["mcp"]
    image: ${OPENFDD_MCP_IMAGE:-ghcr.io/bbartling/openfdd-mcp:nightly}
    build:
      context: ..
      dockerfile: Dockerfile.mcp
    environment:
      OPENFDD_API_BASE: http://central:8080
      OPENFDD_MCP_TOKEN: ${OPENFDD_MCP_TOKEN:-}
    depends_on:
      - central
    stdin_open: true
    tty: true
    logging: *openfdd-logging
    restart: unless-stopped
