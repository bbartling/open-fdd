# Open-FDD standalone HTTPS overlay (Wave U U3 / UA-02) — Caddy + web/central only.
# Combine with compose.standalone.yml + compose.react.yml:
#   OPENFDD_CENTRAL_BIND=127.0.0.1 \
#   docker compose -f docker/compose.standalone.yml \
#     -f docker/compose.react.yml \
#     -f docker/compose.standalone.https.yml \
#     -f docker/compose.standalone.https.mqtt.yml \
#     --profile https-mqtt config
#
# Selected OT (haystack / bacnet-modbus) recipes stay broker-free — use this file
# alone with the OT compose (no mqtt overlay). See S07.
#
# Secure recipe: Caddy owns LAN entry (80/443). Web and central are not published
# on the LAN. Astra A03 TLS modes (pick one Caddyfile via OPENFDD_CADDY_TLS_MODE):
#   provided  → Caddyfile.standalone.https          (+ /certs/server.crt|key)
#   local_ca  → Caddyfile.standalone.https.local_ca (tls internal)
#   lab       → Caddyfile.standalone.https.lab      (+ /certs/lab.crt|key)
# Set OPENFDD_PUBLIC_HOST to the canonical client authority (no silent localhost
# fallback in rendered config — default below is for compose config lint only).

services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "443:443"
      - "80:80"
    environment:
      OPENFDD_PUBLIC_HOST: ${OPENFDD_PUBLIC_HOST:-localhost}
      OPENFDD_CADDY_TLS_MODE: ${OPENFDD_CADDY_TLS_MODE:-provided}
    volumes:
      - ../deploy/caddy/Caddyfile.standalone.https${OPENFDD_CADDYFILE_SUFFIX:-}:/etc/caddy/Caddyfile:ro
      - ../deploy/caddy/certs:/certs:ro
      - caddy-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - web
      - central

  # Remove plaintext SPA / API publication from merged base files.
  # Compose v2 `!reset` clears inherited ports so only Caddy is the LAN HTTP(S) entry.
  web:
    ports: !reset []
    expose:
      - "8080"

  central:
    ports: !reset []
    expose:
      - "8080"

volumes:
  caddy-data:
