name: openfdd-bacnet-mqtt-ci

services:
  bacnet-sim:
    build:
      context: ../tests/integration/bacpypes3
      dockerfile: Dockerfile
    networks:
      ci_net:
        ipv4_address: 172.30.0.10

  # Soft-OPEN D0: Timescale is the product historian (never Parquet).
  timescale:
    image: ${OPENFDD_TIMESCALE_IMAGE:-timescale/timescaledb:latest-pg16}
    environment:
      POSTGRES_USER: openfdd
      POSTGRES_PASSWORD: openfdd_ci_only
      POSTGRES_DB: openfdd
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ../sql/schema/00_extensions.sql:/docker-entrypoint-initdb.d/00_extensions.sql:ro
      - ../sql/schema/01_bps_core.sql:/docker-entrypoint-initdb.d/01_bps_core.sql:ro
      - ../sql/schema/02_openfdd_dims.sql:/docker-entrypoint-initdb.d/02_openfdd_dims.sql:ro
      - ../sql/schema/03_wide_history_helper.sql:/docker-entrypoint-initdb.d/03_wide_history_helper.sql:ro
      - ../sql/schema/04_provider_hourly_jobs.sql:/docker-entrypoint-initdb.d/04_provider_hourly_jobs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfdd -d openfdd"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      ci_net:
        ipv4_address: 172.30.0.50

  mqtt:
    image: ghcr.io/bbartling/openfdd-mqtt:${OPENFDD_IMAGE_TAG:?set OPENFDD_IMAGE_TAG to sha-xxxxxxx}
    volumes:
      # Writable: entrypoint must chown keys to mosquitto (1883) then chmod 640.
      # Product stacks mount this directory read-only; those hosts must set
      # group 1883 before start because the entrypoint cannot chown a :ro file.
      # ACL is the file staged at broker/acl, which lands at /mosquitto/certs/acl.
      - ${OPENFDD_BACNET_MQTT_CERT_DIR:?set OPENFDD_BACNET_MQTT_CERT_DIR}/broker:/mosquitto/certs
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      ci_net:
        ipv4_address: 172.30.0.30

  central:
    image: ghcr.io/bbartling/openfdd-central:${OPENFDD_IMAGE_TAG}
    environment:
      OPENFDD_MQTT_ENABLED: "1"
      OPENFDD_OT_ARCHIVE_RESTORE: "1"
      OPENFDD_MQTT_HOST: mqtt
      OPENFDD_MQTT_PORT: "8883"
      OPENFDD_SITE_ID: ci
      OPENFDD_EDGE_ID: "+"
      OPENFDD_MQTT_CA_PEM: /mqtt/ca.pem
      OPENFDD_MQTT_CERT_PEM: /mqtt/central.cert.pem
      OPENFDD_MQTT_KEY_PEM: /mqtt/central.key.pem
      OPENFDD_WORKSPACE: /workspace
      OPENFDD_STORAGE_URL: file:///workspace/openfdd
      # Wave-X: Timescale-only product historian (STORAGE-LOCK). Never Parquet.
      OPENFDD_DATABASE_URL: postgresql://openfdd:openfdd_ci_only@timescale:5432/openfdd
      OPENFDD_HISTORIAN: timescale
      OPENFDD_FDD_ENGINE: postgres-sql
      OPENFDD_JWT_SECRET: ${OPENFDD_JWT_SECRET:-bacnet-mqtt-ci-jwt-secret-change-me}
      OPENFDD_ADMIN_PASSWORD: ${OPENFDD_ADMIN_PASSWORD:-bacnet-mqtt-ci-admin}
      OPENFDD_REACT_UI: "1"
    volumes:
      - ${OPENFDD_BACNET_MQTT_CERT_DIR}/central:/mqtt:ro
      - central-workspace:/workspace
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      mqtt:
        condition: service_healthy
      timescale:
        condition: service_healthy
    networks:
      ci_net:
        ipv4_address: 172.30.0.40

  fieldbus:
    image: ghcr.io/bbartling/openfdd-fieldbus:${OPENFDD_IMAGE_TAG}
    environment:
      OPENFDD_FIELDBUS_CONFIG_DIR: /app/config
      OPENFDD_FIELDBUS_HTTP_HOST: 0.0.0.0
      OPENFDD_FIELDBUS_HTTP_PORT: "8081"
      # Wave U fail-closed: non-loopback bind requires API key (CI binds 0.0.0.0).
      OPENFDD_FIELDBUS_API_KEY: ${OPENFDD_FIELDBUS_API_KEY:-bacnet-mqtt-ci-fieldbus-key}
      OPENFDD_MQTT_ENABLED: "1"
      OPENFDD_OT_ARCHIVE_RESTORE: "1"
      OPENFDD_MQTT_HOST: mqtt
      OPENFDD_MQTT_PORT: "8883"
      OPENFDD_SITE_ID: ci
      OPENFDD_EDGE_ID: fieldbus-1
      OPENFDD_BUILDING_ID: BUILDING_CI
      OPENFDD_MQTT_CA_PEM: /mqtt/ca.pem
      OPENFDD_MQTT_CERT_PEM: /mqtt/edge.cert.pem
      OPENFDD_MQTT_KEY_PEM: /mqtt/edge.key.pem
      OPENFDD_MQTT_SPOOL_DIR: /spool
      # Wave N: poll/publish locked to 300s in fieldbus; env overrides ignored.
      # First MQTT publish is immediate after connect (no initial 300s sleep).
      OPENFDD_FIELDBUS_POLL_INTERVAL_SECS: "5"
      OPENFDD_MQTT_PUBLISH_INTERVAL_SECS: "5"
    volumes:
      - ../tests/integration/bacpypes3/fieldbus:/app/config:ro
      - ${OPENFDD_BACNET_MQTT_CERT_DIR}/edge:/mqtt:ro
      - fieldbus-spool:/spool
    ports:
      - "127.0.0.1:18081:8081"
    depends_on:
      bacnet-sim:
        condition: service_started
      mqtt:
        condition: service_healthy
    networks:
      ci_net:
        ipv4_address: 172.30.0.20

networks:
  ci_net:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  mqtt-data:
  central-workspace:
  fieldbus-spool:
  timescale-data:
