# ownership.yaml — product + library ownership
schema_version: 1

components:
  rule_metadata:
    canonical_owner: open_fdd.contracts  # Phase 2 target — not shipped yet
    interim_owners:
      - sql_rules/registry.yaml
      - open_fdd.rules.cookbook_catalog
      - docs/rules/cookbook/

  pandas_rule_execution:
    canonical_owner: open_fdd.rules
    related:
      - open_fdd.analytics
    pip_extras:
      - oracle
      - vibe19
    allowed_consumers:
      - vibe19
      - tests
      - notebooks
      - third_party_pypi
    note: PyPI / external tooling only — not the Open-FDD product runtime

  production_rule_execution:
    canonical_owner: openfdd-central
    engine: datafusion_sql
    registry: sql_rules/registry.yaml
    forbidden:
      - silent_pandas_fallback
      - python_request_path

  production_analytics:
    canonical_owner: openfdd-central
    engine: datafusion_sql
    routes: /api/analytics/*
    presentation: frontend/web client Plotly
    forbidden:
      - pandas_overview_oracle
      - python_in_central_image

  generic_ecm_math:
    canonical_owner: open_fdd.ecm_engineering
    allowed_consumers:
      - vibe20
      - notebooks
      - tests
      - third_party_pypi

  energyplus_modeling:
    canonical_owner: vibe20
    includes:
      - idf_editing
      - simulation_orchestration
      - apihelper_processing
      - eplus_calibration

  reporting:
    canonical_owner: open_fdd.reporting
    allowed_consumers:
      - vibe19
      - tests
      - third_party_pypi

  product_react_spa:
    canonical_owner: frontend/web
    image: openfdd-web
    status: sole_production_ui
    backend: services/central
    note: Browser → central /api only; Overview via /api/analytics/* (DataFusion) + client Plotly. No Python product runtime.
    adr: docs/architecture/adr-001-react-rust-modernization.md

  wattlab_offline_export:
    canonical_owner: tools/wattlab_export
    status: optional_offline_tooling
    note: Requires OPENFDD_WATTLAB_PYTHON_EXPORT=1; not shipped in product central image

  vibe21_recovery_program:
    canonical_owner: tools/open-fdd-vibe21-production
    ledger: docs/migration/react-rust/capabilities.yaml
    note: Active Master Loop

  vibe19_demo:
    canonical_owner: vibe_code_apps_19
    image: ghcr.io/bbartling/vibe19
    role: external_pandas_oracle_demo

  vibe20_studio:
    canonical_owner: vibe_code_apps_20
    image: ghcr.io/bbartling/vibe20
    role: energyplus_studio

  cookbooks:
    sql:
      path: docs/rules/cookbook/datafusion-sql-cookbook.md
      role: production
      protected: true
    pandas:
      path: docs/rules/cookbook/pandas-cookbook.md
      role: pypi_oracle_vibe19
      protected: true
    parity_matrix:
      path: docs/rules/cookbook/parity-matrix.md
      protected: true

  future_concepts:
    paths:
      - edge/
      - os/
    policy: never_delete

  mcp:
    canonical_owner: openfdd-mcp
    role: read_first_central_tools

# Milestone C0 — documentation sections that must not be vibe-coded away.
protected_docs:
  root_readme_navigation:
    path: README.md
    required_markers:
      - "FDD Rule Cookbook"
      - "pypi.org/project/open-fdd"
      - "Apache DataFusion"
      - "Apache Arrow"
      - "datafusion-sql-cookbook"
      - "pandas-cookbook"
  pandas_cookbook:
    path: docs/rules/cookbook/pandas-cookbook.md
  sql_cookbook:
    path: docs/rules/cookbook/datafusion-sql-cookbook.md
  parity_matrix:
    path: docs/rules/cookbook/parity-matrix.md
