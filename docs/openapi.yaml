openapi: 3.1.0
info:
  title: Open-FDD Rust Edge API
  version: 3.2.5
  description: |
    Partial spec — full route list from `GET /api/agent/tools` on a running site.
    See docs/AI_AGENT_API.md for narrative reference.
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      security: []
      summary: Liveness
      responses:
        "200":
          description: OK
  /api/auth/login:
    post:
      security: []
      summary: Obtain JWT (admin or agent)
      responses:
        "200":
          description: Token payload
  /api/auth/agent-token:
    post:
      summary: Admin mints short-lived operator JWT for MCP/agents
      responses:
        "200":
          description: Operator token payload
  /api/health/stack:
    get:
      summary: Stack health
      responses:
        "200":
          description: Bridge and sidecar status
  /api/agent/tools:
    get:
      summary: Agent tool manifest
      responses:
        "200":
          description: Tool list for external agents
  /api/model/haystack:
    get:
      summary: Haystack model grid
      responses:
        "200":
          description: Grid JSON with rows
  /api/model/ttl:
    get:
      summary: RDF Turtle export
      responses:
        "200":
          description: text/turtle
          content:
            text/turtle:
              schema:
                type: string
  /api/model/overlay:
    get:
      summary: Soft-OPEN writable Turtle overlay (BPS-compatible)
      parameters:
        - in: query
          name: building_id
          schema:
            type: string
        - in: query
          name: site_id
          schema:
            type: string
          description: BPS alias for building_id
      responses:
        "200":
          description: Overlay TTL + revision (sidecar; not SPARQL pack authority; Soft-OPEN ≠ FQ)
    put:
      summary: Soft-OPEN replace Turtle overlay (dry_run + expected_revision CAS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ttl]
              properties:
                building_id:
                  type: string
                site_id:
                  type: string
                ttl:
                  type: string
                expected_revision:
                  type: integer
                dry_run:
                  type: boolean
      responses:
        "200":
          description: Overlay published or dry_run preview
        "409":
          description: Revision conflict
  /api/model/equip:
    post:
      summary: Soft-OPEN upsert equipment into Turtle overlay (dry_run + CAS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equipment_id]
              properties:
                building_id:
                  type: string
                site_id:
                  type: string
                equipment_id:
                  type: string
                dis:
                  type: string
                kind:
                  type: string
                markers:
                  type: array
                  items:
                    type: string
                expected_revision:
                  type: integer
                dry_run:
                  type: boolean
      responses:
        "200":
          description: Equip upserted or dry_run preview
        "409":
          description: Revision conflict
    delete:
      summary: Soft-OPEN delete/hide equipment (overlay tombstone; pack immutable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equipment_id]
              properties:
                building_id:
                  type: string
                site_id:
                  type: string
                equipment_id:
                  type: string
                expected_revision:
                  type: integer
                dry_run:
                  type: boolean
      responses:
        "200":
          description: Equip tombstoned or dry_run preview
        "409":
          description: Revision conflict
  /api/model/point:
    post:
      summary: Soft-OPEN upsert point into Turtle overlay (dry_run + CAS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equipment_id, point_id]
              properties:
                building_id:
                  type: string
                site_id:
                  type: string
                equipment_id:
                  type: string
                point_id:
                  type: string
                dis:
                  type: string
                openfdd_key:
                  type: string
                role:
                  type: string
                markers:
                  type: array
                  items:
                    type: string
                expected_revision:
                  type: integer
                dry_run:
                  type: boolean
      responses:
        "200":
          description: Point upserted or dry_run preview
        "409":
          description: Revision conflict
    delete:
      summary: Soft-OPEN delete/hide point (overlay tombstone; pack immutable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [point_id]
              properties:
                building_id:
                  type: string
                site_id:
                  type: string
                point_id:
                  type: string
                also_exclude:
                  type: array
                  items:
                    type: string
                expected_revision:
                  type: integer
                dry_run:
                  type: boolean
      responses:
        "200":
          description: Point tombstoned or dry_run preview
        "409":
          description: Revision conflict
  /api/model/agent-context:
    get:
      summary: Soft-OPEN AI agent bundle (revision, lean model tree, mutate recipes)
      parameters:
        - in: query
          name: building_id
          schema:
            type: string
        - in: query
          name: site_id
          schema:
            type: string
          description: BPS alias for building_id
      responses:
        "200":
          description: Agent context JSON (semantic_meta primary + overlay sidecar; Soft-OPEN ≠ FQ)
  /api/model/sparql/predefined:
    get:
      summary: SPARQL query catalog
      responses:
        "200":
          description: Predefined SELECT queries
  /api/model/sparql:
    post:
      summary: Execute SPARQL SELECT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                query_id:
                  type: string
                building_id:
                  type: string
                equipment_id:
                  type: string
      responses:
        "200":
          description: Bindings and row count
        "400":
          description: Invalid request, unknown equipment in semantic_meta scope, or inventory incomplete (`incomplete` true)
        "404":
          description: No committed native semantic model for the building (`present` false on error JSON)
  /api/model/assignments:
    get:
      summary: Driver and FDD bindings
      responses:
        "200":
          description: Assignment layer
  /api/model/sites:
    get:
      summary: Sites and active site
      responses:
        "200":
          description: Site list
  /api/bacnet/driver/tree:
    get:
      summary: BACnet driver tree
      responses:
        "200":
          description: Devices and points
  /api/dashboard/model-coverage:
    get:
      summary: Model coverage metrics
      responses:
        "200":
          description: Equipment and point counts
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
