title: Open-FDD
description: Open-source HVAC fault detection and retro-commissioning, shipped as a Normal Framework app.
theme: just-the-docs

url: https://bbartling.github.io
baseurl: /open-fdd

logo: "/assets/open-fdd-logo.png"

color_scheme: light

search_enabled: true
heading_announcement: false
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  GitHub:
    - //github.com/bbartling/open-fdd
  Releases:
    - //github.com/bbartling/open-fdd/releases

callouts:
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: blue

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/bbartling/open-fdd"
gh_edit_branch: "master"
gh_edit_source: docs
gh_edit_view_mode: "tree"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache

mermaid:
  version: "10.9.1"

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata

github:
  repository: bbartling/open-fdd

defaults:
  - scope:
      path: ""
    values:
      layout: default
