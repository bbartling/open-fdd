<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="875" viewBox="0 0 1230 875" role="img" aria-label="Open-FDD Database Schema"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="black"/></marker></defs><rect width="1230" height="875" fill="white"/><text x="28" y="60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold" fill="black">Open-FDD Database Schema</text><rect x="28" y="100" width="275" height="273" fill="white" stroke="black" stroke-width="1.5"/><rect x="28" y="100" width="275" height="34" fill="#eee" stroke="black"/><text x="40" y="124" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="black">fdd.point</text><text x="40" y="155" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="black">TABLE · point directory</text><line x1="28" y1="168" x2="303" y2="168" stroke="black"/><text x="40" y="188" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  site_id</text><line x1="36" x2="295" y1="194" y2="194" stroke="#ddd"/><text x="40" y="214" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  point_key</text><line x1="36" x2="295" y1="220" y2="220" stroke="#ddd"/><text x="40" y="240" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">equipment_id</text><line x1="36" x2="295" y1="246" y2="246" stroke="#ddd"/><text x="40" y="266" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">role</text><line x1="36" x2="295" y1="272" y2="272" stroke="#ddd"/><text x="40" y="292" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">unit</text><line x1="36" x2="295" y1="298" y2="298" stroke="#ddd"/><text x="40" y="318" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">si_scale, si_offset</text><line x1="28" y1="324" x2="303" y2="324" stroke="black"/><text x="40" y="351" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="black">One row per mapped BAS point</text><rect x="326" y="100" width="275" height="221" fill="white" stroke="black" stroke-width="1.5"/><rect x="326" y="100" width="275" height="34" fill="#eee" stroke="black"/><text x="338" y="124" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="black">fdd.input_sample</text><text x="338" y="155" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="black">VIEW · historian readings</text><line x1="326" y1="168" x2="601" y2="168" stroke="black"/><text x="338" y="188" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">site_id</text><line x1="334" x2="593" y1="194" y2="194" stroke="#ddd"/><text x="338" y="214" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">point_key</text><line x1="334" x2="593" y1="220" y2="220" stroke="#ddd"/><text x="338" y="240" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">ts</text><line x1="334" x2="593" y1="246" y2="246" stroke="#ddd"/><text x="338" y="266" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">value (SI)</text><line x1="326" y1="272" x2="601" y2="272" stroke="black"/><text x="338" y="299" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="black">Join to fdd.point (not FK)</text><rect x="624" y="100" width="275" height="351" fill="white" stroke="black" stroke-width="1.5"/><rect x="624" y="100" width="275" height="34" fill="#eee" stroke="black"/><text x="636" y="124" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="black">fdd.rule_result</text><text x="636" y="155" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="black">TIMESCALE HYPERTABLE (Full)</text><line x1="624" y1="168" x2="899" y2="168" stroke="black"/><text x="636" y="188" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  site_id</text><line x1="632" x2="891" y1="194" y2="194" stroke="#ddd"/><text x="636" y="214" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  equipment_id</text><line x1="632" x2="891" y1="220" y2="220" stroke="#ddd"/><text x="636" y="240" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  rule_id</text><line x1="632" x2="891" y1="246" y2="246" stroke="#ddd"/><text x="636" y="266" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  subject_key</text><line x1="632" x2="891" y1="272" y2="272" stroke="#ddd"/><text x="636" y="292" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  window_start</text><line x1="632" x2="891" y1="298" y2="298" stroke="#ddd"/><text x="636" y="318" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  window_end</text><line x1="632" x2="891" y1="324" y2="324" stroke="#ddd"/><text x="636" y="344" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  rule_hash</text><line x1="632" x2="891" y1="350" y2="350" stroke="#ddd"/><text x="636" y="370" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  config_hash</text><line x1="632" x2="891" y1="376" y2="376" stroke="#ddd"/><text x="636" y="396" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">status, fault_hours</text><line x1="624" y1="402" x2="899" y2="402" stroke="black"/><text x="636" y="429" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="black">Time partition: window_end</text><rect x="922" y="100" width="275" height="273" fill="white" stroke="black" stroke-width="1.5"/><rect x="922" y="100" width="275" height="34" fill="#eee" stroke="black"/><text x="934" y="124" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="black">fdd.rule_config</text><text x="934" y="155" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="black">TABLE · rule tuning</text><line x1="922" y1="168" x2="1197" y2="168" stroke="black"/><text x="934" y="188" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  site_id</text><line x1="930" x2="1189" y1="194" y2="194" stroke="#ddd"/><text x="934" y="214" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  rule_id</text><line x1="930" x2="1189" y1="220" y2="220" stroke="#ddd"/><text x="934" y="240" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  scope_key</text><line x1="930" x2="1189" y1="246" y2="246" stroke="#ddd"/><text x="934" y="266" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">PK  revision</text><line x1="930" x2="1189" y1="272" y2="272" stroke="#ddd"/><text x="934" y="292" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">parameters (JSON)</text><line x1="930" x2="1189" y1="298" y2="298" stroke="#ddd"/><text x="934" y="318" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">active</text><line x1="922" y1="324" x2="1197" y2="324" stroke="black"/><text x="934" y="351" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="black">Settings by scope and version</text><path d="M 326 225 H 303" fill="none" stroke="black" stroke-width="2" marker-end="url(#arr)"/><text x="286" y="198" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="black">join</text><rect x="45" y="490" width="1120" height="285" fill="white" stroke="black" stroke-width="1.5"/><text x="60" y="522" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="black">How rules use the data</text><rect x="68" y="551" width="245" height="85" fill="white" stroke="black" stroke-width="1.5"/><text x="85" y="580" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="black">fdd.point + input_sample</text><text x="85" y="607" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="black">Map samples into SI roles</text><rect x="383" y="551" width="210" height="85" fill="white" stroke="black" stroke-width="1.5"/><text x="404" y="580" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="black">history</text><text x="404" y="607" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="black">Per-run scratch table</text><rect x="675" y="551" width="205" height="85" fill="white" stroke="black" stroke-width="1.5"/><text x="693" y="580" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="black">SQL rule engine</text><text x="693" y="607" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="black">Evaluate fault hours</text><rect x="952" y="551" width="187" height="85" fill="white" stroke="black" stroke-width="1.5"/><text x="969" y="580" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="black">fdd.rule_result</text><text x="969" y="607" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="black">Store assessments</text><path d="M 313 593 H 380 M 593 593 H 672 M 880 593 H 949" fill="none" stroke="black" stroke-width="2" marker-end="url(#arr)"/><text x="68" y="679" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="black">history: equipment_id + timestamp_utc + sensor role columns (sat, fan_status, etc.)</text><text x="68" y="709" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">Optional scratch inputs: weather, sensor_history, utility tables — only for rules that need them.</text><text x="68" y="741" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">fdd.rule_config supplies tuned parameters; the SQL engine writes results to fdd.rule_result.</text><text x="35" y="811" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="black">PK = primary key. No FK constraints are declared between these core objects; joins are application-level.</text><text x="35" y="842" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" fill="black">Input view is not a hypertable. The shared schema creates rule_result as a table; NF Full converts it to a hypertable.</text></svg>