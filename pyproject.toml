[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-fdd"
version = "4.1.2"
description = "Open-FDD libraries: ECM engineering workbooks plus pandas oracle rules, analytics, and Engineering Findings reporting. Production FDD remains the DataFusion/GHCR stack."
readme = "docs/ecm/README.md"
license = { text = "MIT" }
authors = [
    { name = "Ben Bartling", email = "ben.bartling@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
keywords = [
    "hvac",
    "ecm",
    "fdd",
    "fault-detection",
    "energy-conservation",
    "building-automation",
    "open-fdd",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bbartling/open-fdd"
Documentation = "https://bbartling.github.io/open-fdd/"
Repository = "https://github.com/bbartling/open-fdd"

[project.scripts]
open-fdd-ecm = "open_fdd.ecm_engineering.cli:main"
open-fdd-report = "open_fdd.reporting.cli:main"

[project.optional-dependencies]
ecm-web = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.4,<3",
]
oracle = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]
reporting = [
    "open-fdd[oracle]",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8.0",
    "plotly>=5.22.0",
    "kaleido>=0.2.1",
]
vibe19 = [
    "open-fdd[reporting]",
]
test = [
    "pytest>=7.0",
    "open-fdd[reporting]",
]
dev = [
    "pytest>=7.0",
    "build>=1.2.0",
    "twine>=6.0.0",
    "open-fdd[reporting]",
]
release = [
    "build>=1.2.0",
    "twine>=6.0.0",
]

[tool.setuptools.packages.find]
include = ["open_fdd*"]

[tool.setuptools.package-data]
"open_fdd.ecm_engineering" = [
    "data/*.xlsx",
    "data/*.json",
    "examples/**/*.xlsx",
    "examples/**/*.md",
    "examples/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests/ecm", "tests/rules", "tests/analytics", "tests/reporting"]
pythonpath = ["."]
