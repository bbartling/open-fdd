[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-fdd"
version = "4.5.10"
description = "Open-FDD Python tools: pandas reference FDD rules (SI), Normal Framework data access for AI agents, reports and ECM workbooks."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ben Bartling", email = "ben.bartling@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]
keywords = [
    "hvac",
    "ecm",
    "fdd",
    "fault-detection",
    "energy-conservation",
    "building-automation",
    "open-fdd",
    "rcx",
    "ai-agent",
    "reporting",
]
# Floors are the latest stable releases tested on 2026-11-16 (no upper bounds, as before; pydantic keeps <3).
# Libraries whose latest release dropped an older Python keep a floor for that Python behind a marker:
# pandas 3.x / scikit-learn 1.9 / matplotlib 3.11 / duckdb 2.x need 3.11+, numpy 2.5 / scipy 1.18 need 3.12+.
dependencies = [
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/bbartling/open-fdd"
Documentation = "https://bbartling.github.io/open-fdd/"
Repository = "https://github.com/bbartling/open-fdd"

[project.scripts]
open-fdd-ecm = "open_fdd.ecm_engineering.cli:main"
open-fdd-report = "open_fdd.reporting.cli:main"
open-fdd-version = "open_fdd.version:main"
open-fdd-anomaly = "open_fdd.analytics.anomaly.cli:main"
open-fdd-nf = "open_fdd.nf.cli:main"
open-fdd-ml = "open_fdd.ml.cli:main"
open-fdd-ontology-audit = "open_fdd.ontology_audit.cli:main"

[project.optional-dependencies]
ecm-web = [
    "fastapi>=0.163.1; python_version >= '3.11'",
    "fastapi>=0.162.5; python_version < '3.11'",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.3,<3",
]
oracle = [
    "pandas>=3.1.1; python_version >= '3.11'",
    "pandas>=2.3.3; python_version < '3.11'",
    "numpy>=2.5.5; python_version >= '3.12'",
    "numpy>=2.4.6; python_version == '3.11'",
    "numpy>=2.2.6; python_version < '3.11'",
    "pyyaml>=6.0.3",
]
reporting = [
    "open-fdd[oracle]",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "matplotlib>=3.11.2; python_version >= '3.11'",
    "matplotlib>=3.10.9; python_version < '3.11'",
    "plotly>=7.1.0",
    "kaleido>=1.5.1",
    "requests>=2.34.2",
]
analytics = [
    "open-fdd[oracle]",
    "requests>=2.34.2",
]
# Read a Normal Framework box: SI frames + the pandas rules (client itself is stdlib only).
nf = [
    "open-fdd[oracle]",
]
# Read the NF app's RDF/Turtle export.
rdf = [
    "rdflib>=7.6.0",
]
# Offline SQL parity replay (borrowing sql/fdd on DuckDB); also the in-process DuckDB engine of the SQL analytics.
duckdb = [
    "duckdb>=2.0.0; python_version >= '3.11'",
    "duckdb>=1.5.6; python_version < '3.11'",
]
# Standalone PostgreSQL parity driver.
postgres = [
    "psycopg[binary]>=3.3.9",
]
anomaly = [
    "open-fdd[oracle]",
    "matplotlib>=3.11.2; python_version >= '3.11'",
    "matplotlib>=3.10.9; python_version < '3.11'",
    "statsmodels>=0.15.0",
    "scikit-learn>=1.9.1; python_version >= '3.11'",
    "scikit-learn>=1.7.2; python_version < '3.11'",
    "scipy>=1.18.1; python_version >= '3.12'",
    "scipy>=1.17.1; python_version == '3.11'",
    "scipy>=1.15.3; python_version < '3.11'",
    "requests>=2.34.2",
]
# ML FDD benchmark (LBNL data) and detectors: open-fdd-ml. Core install unchanged.
ml = [
    "open-fdd[oracle]",
    "matplotlib>=3.11.2; python_version >= '3.11'",
    "matplotlib>=3.10.9; python_version < '3.11'",
    "scikit-learn>=1.9.1; python_version >= '3.11'",
    "scikit-learn>=1.7.2; python_version < '3.11'",
    "scipy>=1.18.1; python_version >= '3.12'",
    "scipy>=1.17.1; python_version == '3.11'",
    "scipy>=1.15.3; python_version < '3.11'",
]
# COPOD for open-fdd-ml (pyod pulls numba + llvmlite, kept out of the ml extra).
ml-copod = [
    "open-fdd[ml]",
    "pyod>=3.6.8",
]
# open-fdd-ontology-audit: requirements coverage audit and model doctor (#1569); SHACL is optional
ontology = [
    "rdflib>=7.6.0",
    "openpyxl>=3.1.5",
]
ontology-shacl = [
    "open-fdd[ontology]",
    "pyshacl>=0.40.2",
]
test = [
    "pytest>=9.2.0",
    "open-fdd[reporting]",
    "open-fdd[anomaly]",
    "open-fdd[ml]",
    "open-fdd[ontology-shacl]",
    "duckdb>=2.0.0; python_version >= '3.11'",
    "duckdb>=1.5.6; python_version < '3.11'",
]
dev = [
    "pytest>=9.2.0",
    "build>=1.6.1",
    "twine>=7.0.0",
    "open-fdd[reporting]",
    "open-fdd[anomaly]",
    "open-fdd[ml]",
    "open-fdd[ontology-shacl]",
]
release = [
    "build>=1.6.1",
    "twine>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["open_fdd*"]

[tool.setuptools.package-data]
"open_fdd" = ["data/*.json", "data/*.sql"]
"open_fdd.ontology_audit" = ["data/*.json", "data/*.csv", "data/*.ttl"]
"open_fdd.ecm_engineering" = [
    "data/*.xlsx",
    "data/*.json",
    "data/*.ttl",
    "examples/**/*.xlsx",
    "examples/**/*.md",
    "examples/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
