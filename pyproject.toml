[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-fdd"
version = "4.4.8"
description = "Open-FDD for AI agents: RCx/FDD reports from mapped roles (local CSV, Railway or self-hosted Open-FDD, or a future vendor API), plus ECM engineering workbooks. Production FDD remains the DataFusion/GHCR stack."
readme = "docs/ecm/README.md"
license = { text = "MIT" }
authors = [
    { name = "Ben Bartling", email = "ben.bartling@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
keywords = [
    "hvac",
    "ecm",
    "fdd",
    "fault-detection",
    "energy-conservation",
    "building-automation",
    "open-fdd",
    "rcx",
    "ai-agent",
    "reporting",
]
dependencies = [
    "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/bbartling/open-fdd"
Documentation = "https://bbartling.github.io/open-fdd/"
Repository = "https://github.com/bbartling/open-fdd"

[project.scripts]
open-fdd-ecm = "open_fdd.ecm_engineering.cli:main"
open-fdd-report = "open_fdd.reporting.cli:main"
open-fdd-version = "open_fdd.version:main"
open-fdd-anomaly = "open_fdd.analytics.anomaly.cli:main"

[project.optional-dependencies]
ecm-web = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.4,<3",
]
oracle = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]
reporting = [
    "open-fdd[oracle]",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8.0",
    "plotly>=5.22.0",
    "kaleido>=0.2.1",
]
analytics = [
    "open-fdd[oracle]",
]
anomaly = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
]
# Deprecated alias of reporting; removed in open-fdd 5.0. Prefer reporting/analytics/oracle.
vibe19 = [
    "open-fdd[reporting]",
]
test = [
    "pytest>=7.0",
    "open-fdd[reporting]",
    "open-fdd[anomaly]",
]
dev = [
    "pytest>=7.0",
    "build>=1.2.0",
    "twine>=6.0.0",
    "open-fdd[reporting]",
    "open-fdd[anomaly]",
]
release = [
    "build>=1.2.0",
    "twine>=6.0.0",
]

[tool.setuptools.packages.find]
include = ["open_fdd*"]

[tool.setuptools.package-data]
"open_fdd.ecm_engineering" = [
    "data/*.xlsx",
    "data/*.json",
    "data/*.ttl",
    "examples/**/*.xlsx",
    "examples/**/*.md",
    "examples/**/*.json",
]

[tool.pytest.ini_options]
testpaths = [
    "tests/ecm",
    "tests/ecm_engineering",
    "tests/rules",
    "tests/analytics",
    "tests/reporting",
]
pythonpath = ["."]
