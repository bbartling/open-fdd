[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-fdd"
version = "4.5.11"
description = "Open-FDD Python tools: pandas reference FDD rules (SI), Normal Framework data access for AI agents, reports and ECM workbooks."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ben Bartling", email = "ben.bartling@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]
keywords = [
    "hvac",
    "ecm",
    "fdd",
    "fault-detection",
    "energy-conservation",
    "building-automation",
    "open-fdd",
    "rcx",
    "ai-agent",
    "reporting",
]
# Floors are the latest stable releases tested on 2026-11-19 (no upper bounds, as before; pydantic keeps <3).
# Python 3.11+ only. numpy 2.5 / scipy 1.18 need 3.12+, so 3.11 keeps their last 3.11 release behind a marker.
dependencies = [
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/bbartling/open-fdd"
Documentation = "https://bbartling.github.io/open-fdd/"
Repository = "https://github.com/bbartling/open-fdd"

[project.scripts]
open-fdd-ecm = "open_fdd.ecm_engineering.cli:main"
open-fdd-report = "open_fdd.reporting.cli:main"
open-fdd-version = "open_fdd.version:main"
open-fdd-anomaly = "open_fdd.analytics.anomaly.cli:main"
open-fdd-nf = "open_fdd.nf.cli:main"
open-fdd-ml = "open_fdd.ml.cli:main"
open-fdd-scorecard = "open_fdd.scorecard.cli:main"
open-fdd-ontology-audit = "open_fdd.ontology_audit.cli:main"
open-fdd-rca = "open_fdd.rca.cli:main"

[project.optional-dependencies]
ecm-web = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.4,<3",
]
oracle = [
    "pandas>=3.1.1",
    "numpy>=2.5.5; python_version >= '3.12'",
    "numpy>=2.4.6; python_version < '3.12'",
    "pyyaml>=6.0.3",
]
reporting = [
    "open-fdd[oracle]",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "kaleido>=1.5.2",
    "requests>=2.34.2",
]
analytics = [
    "open-fdd[oracle]",
    "requests>=2.34.2",
]
# Read a Normal Framework box: SI frames + the pandas rules (client itself is stdlib only).
nf = [
    "open-fdd[oracle]",
]
# Read the NF app's RDF/Turtle export. rdflib parses; pyoxigraph 0.5.13 evaluates SPARQL
# (the same release as the vendored Oxigraph build in the Full app).
rdf = [
    "rdflib==7.6.0",
    "pyoxigraph==0.5.13",
]
# Offline SQL parity replay (borrowing sql/fdd on DuckDB); also the in-process DuckDB engine of the SQL analytics.
duckdb = [
    "duckdb>=2.0.1",
]
# Standalone PostgreSQL parity driver.
postgres = [
    "psycopg[binary]>=3.3.9",
]
anomaly = [
    "open-fdd[oracle]",
    "matplotlib>=3.11.2",
    "statsmodels>=0.15.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1; python_version >= '3.12'",
    "scipy>=1.17.1; python_version < '3.12'",
    "requests>=2.34.2",
]
# ML FDD benchmark (LBNL data) and detectors: open-fdd-ml. Core install unchanged.
ml = [
    "open-fdd[oracle]",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1; python_version >= '3.12'",
    "scipy>=1.17.1; python_version < '3.12'",
]
# COPOD for open-fdd-ml (pyod pulls numba + llvmlite, kept out of the ml extra).
ml-copod = [
    "open-fdd[ml]",
    "pyod>=3.6.8",
]
# open-fdd-ontology-audit: requirements coverage audit and model doctor (#1569); SHACL is optional.
# rdflib parses. SPARQL answers use pyoxigraph, pinned to the app's Oxigraph release.
ontology = [
    "rdflib==7.6.0",
    "pyoxigraph==0.5.13",
    "openpyxl>=3.1.5",
]
ontology-shacl = [
    "open-fdd[ontology]",
    "pyshacl==0.40.2",
]
# Offline 223P closure (OntoEnv) and Shifty. Not imported by the NF app.
ontology-align = [
    "open-fdd[ontology-shacl]",
    "ontoenv==0.6.4",
    "pyshifty==0.6.0",
]
test = [
    "pytest>=9.2.0",
    "open-fdd[reporting]",
    "open-fdd[anomaly]",
    "open-fdd[ml]",
    "open-fdd[ontology-shacl]",
    "duckdb>=2.0.1",
]
dev = [
    "pytest>=9.2.0",
    "build>=1.6.1",
    "twine>=7.0.0",
    "open-fdd[reporting]",
    "open-fdd[anomaly]",
    "open-fdd[ml]",
    "open-fdd[ontology-shacl]",
]
release = [
    "build>=1.6.1",
    "twine>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["open_fdd*"]

[tool.setuptools.package-data]
"open_fdd" = ["data/*.json", "data/*.sql"]
"open_fdd.ontology_audit" = ["data/*.json", "data/*.csv", "data/*.ttl", "data/223p/*.ttl", "data/223p/closure/*"]
"open_fdd.rca" = ["data/*.ttl", "data/*.json"]
"open_fdd.scorecard" = ["*.sql"]
"open_fdd.ecm_engineering" = [
    "data/*.xlsx",
    "data/*.json",
    "data/*.ttl",
    "examples/**/*.xlsx",
    "examples/**/*.md",
    "examples/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
