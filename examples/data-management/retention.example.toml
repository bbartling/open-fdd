# Example retention policy (copy to workspace/data-management/retention.local.toml)
# No automatic purge runs unless OPENFDD_RETENTION_SIDECAR_ENABLED=1 and cron invokes
# scripts/openfdd_data_retention_sidecar.sh

# validation_days = 90

[bacnet_live]
keep_days = 365

[json_api]
keep_days = 180

[import_projects]
keep_all = true

# Local/edge pool for historian + analytics result parquet.
# Oldest part first. Railway volumes stay on their own policy unless
# OPENFDD_DATA_BUDGET_ENABLED=1. See docs/operations/DATA_RETENTION_BUDGET.md.
[storage_cap]
enabled = true
max_gib = 100
oldest_first = true
reserved_free_percent = 10
