# SQL rule registry — source of truth for Timescale/PostgreSQL FDD rules.
# Role names are roles/openfdd-roles.json. Damper, valve and fan-speed thresholds are PERCENT 0-100.
# Python oracle mapping: see fdd_app/export_pandas_oracle.py SQL_TO_COOKBOOK
rules:
- rule_id: FAN-RUNTIME-HOURS
  operating_status: exempt
  run_proof_note: measures the equipment runtime itself
  sql_file: fan_runtime_hours.sql
  pandas_function: null
  description: Fan running hours where supply_fan_command > 5% (normalized 0-1)
  required_roles:
  - supply_fan_command
  output_columns:
  - equipment_id
  - fan_runtime_hours
  - total_hours
  priority: P0
  parity_status: sql_screening
  delete_python_candidate: false
  confirm_seconds: 0
  parameters: {}
- rule_id: VAV-1
  equipment_kinds:
  - vav
  - zone_other
  - heatpump
  - baseboard
  operating_status: exempt
  run_proof_note: zone comfort band while occupied; independent of the air handler running
  sql_file: vav1_comfort_fault.sql
  pandas_function: vav1
  description: Zone comfort band during occupied hours when occupancy is set; unoccupied setback is VAV-2; no occupancy model
    or schedule → NOT_ASSESSED_NO_OCCUPANCY
  required_roles:
  - zone_air_temperature
  optional_roles:
  - occupancy_status
  output_columns:
  - equipment_id
  - fault_hours
  - fault_pct
  priority: P0
  parity_status: sql_screening
  delete_python_candidate: false
  confirm_seconds: 900
  parameters:
    zone_t_lo:
      label: Zone low
      default: 21.111111111
      min: 12.777777778
      max: 22.222222222
      step: 0.277777778
      unit: DEG_C
      kind: absolute_temperature
      frontend_control: slider
      sql_placeholder: ZONE_T_LO
    zone_t_hi:
      label: Zone high
      default: 23.888888889
      min: 22.222222222
      max: 29.444444444
      step: 0.277777778
      unit: DEG_C
      kind: absolute_temperature
      frontend_control: slider
      sql_placeholder: ZONE_T_HI
    require_occupied:
      label: Require occupied
      default: 1.0
      min: 0.0
      max: 1.0
      step: 1.0
      unit: boolean
      kind: boolean
      frontend_control: slider
      sql_placeholder: REQUIRE_OCCUPIED
    confirm_seconds:
      label: Confirm time
      default: 900
      min: 0
      max: 3600
      step: 300
      unit: SEC
      kind: duration_seconds
      frontend_control: slider
      sql_placeholder: CONFIRM_SECONDS
- rule_id: VAV-2
  equipment_kinds:
  - vav
  - zone_other
  - heatpump
  - baseboard
  operating_status: exempt
  run_proof_note: night setback runs while the air handler is off by design
  sql_file: vav2_night_setback.sql
  pandas_function: vav2
  description: Night setback miss — unoccupied zone above heating setback
  required_roles:
  - zone_air_temperature
  - occupancy_status
  output_columns:
  - equipment_id
  - fault_hours
  priority: P0
  parity_status: sql_screening
  delete_python_candidate: false
  confirm_seconds: 900
  parameters:
    setback_hi:
      label: Setback high
      default: 20.0
      min: 12.777777778
      max: 22.222222222
      step: 0.277777778
      unit: DEG_C
      kind: absolute_temperature
      frontend_control: slider
      sql_placeholder: SETBACK_HI
    confirm_seconds:
      label: Confirm time
      default: 900
      min: 0
      max: 3600
      step: 300
      unit: SEC
      kind: duration_seconds
      frontend_control: slider
      sql_placeholder: CONFIRM_SECONDS
- rule_id: AVG-ZONE-TEMP
  operating_status: exempt
  run_proof_note: zone statistic, not an equipment fault
  sql_file: avg_zone_temp.sql
  pandas_function: null
  description: Average zone temperature per equipment
  required_roles:
  - zone_air_temperature
  output_columns:
  - equipment_id
  - avg_zone_temp
  - min_zone_temp
  - max_zone_temp
  output_units:
    avg_zone_temp:
      unit: degC
      kind: absolute_temperature
    min_zone_temp:
      unit: degC
      kind: absolute_temperature
    max_zone_temp:
      unit: degC
      kind: absolute_temperature
  priority: P0
  parity_status: sql_screening
  delete_python_candidate: false
  confirm_seconds: 0
  parameters:
    zone_t_lo:
      label: Zone comfort low (reference)
      default: 20.0
      min: 15.555555556
      max: 22.222222222
      step: 0.277777778
      unit: DEG_C
      kind: absolute_temperature
      frontend_control: slider
      sql_placeholder: ZONE_T_LO
    zone_t_hi:
      label: Zone comfort high (reference)
      default: 24.444444444
      min: 22.222222222
      max: 29.444444444
      step: 0.277777778
      unit: DEG_C
      kind: absolute_temperature
      frontend_control: slider
      sql_placeholder: ZONE_T_HI
