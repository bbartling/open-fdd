- rule_id: OAT-METEO
  equipment_kinds:
  - ahu
  operating_status: exempt
  run_proof_note: compares two outside-air sources; no running equipment is judged
  sql_file: oat_meteo_fault.sql
  pandas_function: oat_vs_meteo
  description: Equipment OAT vs weather-staged wx OAT
  required_roles:
  - outdoor_air_intake_temperature
  optional_roles:
  - weather_service_air_temperature
  output_columns:
  - equipment_id
  - fault_hours
  - fault_pct
  priority: P0
  parity_status: sql_screening
  delete_python_candidate: false
  confirm_seconds: 900
  parameters:
    oat_err:
      label: OAT vs meteo tolerance
      default: 2.777778
      min: 1.111111
      max: 11.111111
      step: 0.277778
      unit: K
      kind: temperature_difference
      frontend_control: slider
      sql_placeholder: OAT_ERR
    confirm_seconds:
      label: Confirm time
      default: 900
      min: 0
      max: 3600
      step: 300
      unit: SEC
      kind: duration_seconds
      frontend_control: slider
      sql_placeholder: CONFIRM_SECONDS
- rule_id: FC13-SAT-HIGH
  equipment_kinds:
  - ahu
  aliases:
  - FC13
  operating_status: gated
  sql_file: sat_high_fault.sql
  pandas_function: fc13
  description: SAT above setpoint at full cooling
  required_roles:
  - discharge_air_temperature
  - discharge_air_temperature_setpoint
  - cooling_valve_position_command
  - outdoor_air_intake_damper_position_command
  optional_roles:
  - supply_fan_operating_status
  - supply_fan_command
  - operating_status
  output_columns:
  - equipment_id
  - fault_hours
  priority: P0
  parity_status: sql_screening
  delete_python_candidate: false
  confirm_seconds: 600
  parameters:
    require_run_proof:
      label: Require motor status
      default: 1.0
      min: 0.0
      max: 1.0
      step: 1.0
      unit: boolean
      kind: boolean
      frontend_control: slider
      sql_placeholder: REQUIRE_RUN_PROOF
    eps_sat:
      label: SAT sensor eps
      default: 0.638888889
      min: 0.0
      max: 5.555555556
      step: 0.138888889
      unit: K
      kind: temperature_difference
      frontend_control: slider
      sql_placeholder: EPS_SAT
    econ_min_pos:
      label: Econ damper min pos
      default: 5.0
      min: 0.0
      max: 50.0
      step: 1.0
      unit: PERCENT
      kind: percent
      frontend_control: slider
      sql_placeholder: ECON_MIN_POS
    econ_full_open:
      label: Econ damper full-open
      default: 90.0
      min: 50.0
      max: 100.0
      step: 5.0
      unit: PERCENT
      kind: percent
      frontend_control: slider
      sql_placeholder: ECON_FULL_OPEN
    clg_full_min:
      label: Cooling valve full min
      default: 90.0
      min: 50.0
      max: 100.0
      step: 5.0
      unit: PERCENT
      kind: percent
      frontend_control: slider
      sql_placeholder: CLG_FULL_MIN
    oa_damper_econ_low:
      label: OA damper economizer low
      default: 5.0
      min: 0.0
      max: 50.0
      step: 1.0
      unit: PERCENT
      kind: percent
      frontend_control: slider
      sql_placeholder: OA_DAMPER_ECON_LOW
    confirm_seconds:
      label: Confirm time
      default: 600
      min: 0
      max: 3600
      step: 300
      unit: SEC
      kind: duration_seconds
      frontend_control: slider
      sql_placeholder: CONFIRM_SECONDS
  legacy_parameters:
    aliases: {}
    retired:
    - fan_on_min
    note: Boolean start/stop thresholds (fan_on_min and the like) are retired; a saved value is ignored (#1812).
